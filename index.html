{id:"b73",n:"Spaghetti à la bolognaise",c:"Viande",t:35,i:[["Bœuf haché",300,"g","viande"],["Coulis de tomate",500,"g","epi"],["Oignon",1,"","leg"],["Carottes",1,"","leg"],["Ail",1,"gousse","leg"],["Spaghetti",200,"g","epi"],["Parmesan",30,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Faire revenir l'oignon, la carotte et l'ail hachés dans l'huile à puissance 6 pendant 5 min.","Ajouter la viande et la faire dorer 5 min à puissance 7.","Verser le coulis et laisser mijoter à puissance 3 pendant 20 min.","Cuire les spaghetti : puissance 9 puis puissance 8 pendant 10 min. Servir avec le parmesan."]},
{id:"b74",n:"Moussaka",c:"Viande",t:90,i:[["Aubergines",2,"","leg"],["Bœuf haché",300,"g","viande"],["Tomates concassées",400,"g","epi"],["Oignon",1,"","leg"],["Béchamel",40,"cl","epi"],["Cannelle",1,"pincée","epi"],["Emmental râpé",50,"g","cremerie"],["Huile d'olive",3,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C. Couper les aubergines en tranches, les badigeonner d'huile et les enfourner 20 min.","Faire revenir l'oignon dans un peu d'huile à puissance 6 pendant 3 min, ajouter la viande 5 min à puissance 7, puis les tomates et la cannelle. Laisser mijoter à puissance 3 pendant 15 min.","Dans un plat, alterner aubergines et viande, puis couvrir de béchamel et de fromage.","Baisser le four à 180 °C et enfourner 35 min."]},
{id:"b75",n:"Bo bun au bœuf",c:"Viande",t:30,i:[["Rumsteck",250,"g","viande"],["Vermicelles de riz",120,"g","epi"],["Salade verte",1,"","leg"],["Carottes",2,"","leg"],["Concombre",1,"","leg"],["Cacahuètes",30,"g","epi"],["Menthe",1,"botte","leg"],["Sauce nuoc-mâm",3,"c. à s.","epi"],["Citron vert",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Plonger les vermicelles 4 min dans l'eau bouillante à puissance 9, puis les rincer à l'eau froide.","Préparer la sauce : nuoc-mâm, jus du citron vert et 3 c. à s. d'eau.","Saisir le bœuf émincé dans l'huile à puissance 9 pendant 2 min.","Dresser les bols : salade, vermicelles, carottes râpées, concombre, bœuf, menthe, cacahuètes et sauce."]},
{id:"b76",n:"Keftas d'agneau et taboulé",c:"Viande",t:35,i:[["Agneau haché",300,"g","viande"],["Semoule",120,"g","epi"],["Tomates",2,"","leg"],["Concombre",1,"","leg"],["Menthe",1,"botte","leg"],["Citron",1,"","leg"],["Cumin",1,"c. à c.","epi"],["Huile d'olive",3,"c. à s.","plac"]],s:["Préparer la semoule avec le même volume d'eau bouillante, laisser gonfler 5 min, égrainer et laisser refroidir.","Mélanger la semoule avec les tomates et le concombre en dés, la menthe ciselée, le jus du citron et 2 c. à s. d'huile.","Mélanger l'agneau avec le cumin, du sel et du poivre, puis former des petits boudins.","Cuire les keftas dans le reste d'huile à puissance 7 pendant 8 min en les retournant."]},
{id:"b77",n:"Sauté de veau aux carottes et tagliatelles",c:"Viande",t:75,i:[["Sauté de veau",500,"g","viande"],["Carottes",4,"","leg"],["Oignon",1,"","leg"],["Bouillon de volaille",1,"cube","epi"],["Crème fraîche",10,"cl","cremerie"],["Tagliatelles",200,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Dorer le veau dans l'huile à puissance 8 pendant 6 min, puis ajouter l'oignon émincé et cuire 3 min.","Ajouter les carottes en rondelles et 40 cl de bouillon, couvrir et laisser mijoter à puissance 3 pendant 50 min.","Cuire les tagliatelles : puissance 9 puis puissance 8, selon le temps du paquet.","Incorporer la crème au sauté et servir avec les pâtes."]},
{id:"b78",n:"Gratin de courgettes à la viande hachée",c:"Viande",t:45,i:[["Courgettes",3,"","leg"],["Bœuf haché",250,"g","viande"],["Oignon",1,"","leg"],["Coulis de tomate",200,"g","epi"],["Emmental râpé",60,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C. Couper les courgettes en rondelles et les faire revenir dans l'huile à puissance 7 pendant 8 min.","Dans une autre poêle, dorer l'oignon et la viande à puissance 7 pendant 6 min, puis ajouter le coulis.","Alterner courgettes et viande dans un plat, puis parsemer de fromage.","Enfourner 25 min."]},
{id:"b79",n:"Poivrons farcis au bœuf et au riz",c:"Viande",t:55,i:[["Poivron rouge",2,"","leg"],["Poivron jaune",2,"","leg"],["Bœuf haché",250,"g","viande"],["Riz basmati",80,"g","epi"],["Coulis de tomate",300,"g","epi"],["Oignon",1,"","leg"],["Emmental râpé",40,"g","cremerie"]],s:["Cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min. Préchauffer le four à 190 °C.","Dorer l'oignon et la viande à puissance 7 pendant 6 min, puis mélanger avec le riz et la moitié du coulis.","Couper le haut des poivrons, les épépiner et les farcir.","Les placer dans un plat avec le reste de coulis, parsemer de fromage et enfourner 35 min."]},
{id:"b80",n:"Bœuf stroganoff et riz",c:"Viande",t:30,i:[["Rumsteck",300,"g","viande"],["Champignons de Paris",200,"g","leg"],["Oignon",1,"","leg"],["Crème fraîche",20,"cl","cremerie"],["Paprika",1,"c. à c.","epi"],["Moutarde",1,"c. à c.","epi"],["Riz basmati",150,"g","epi"],["Beurre",15,"g","cremerie"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Saisir le bœuf en lanières dans le beurre à puissance 9 pendant 2 min, puis le réserver.","Faire revenir l'oignon et les champignons émincés à puissance 6 pendant 6 min, puis ajouter le paprika.","Ajouter la crème et la moutarde, remettre le bœuf et chauffer 2 min à puissance 3."]},
{id:"b81",n:"Carbonade flamande",c:"Viande",t:150,i:[["Bœuf à braiser",600,"g","viande"],["Oignon",3,"","leg"],["Bière brune",33,"cl","epi"],["Pain d'épices",2,"tranche","epi"],["Moutarde",1,"c. à s.","epi"],["Cassonade",1,"c. à s.","epi"],["Frites surgelées",400,"g","surg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Dorer la viande dans l'huile à puissance 8, en plusieurs fois, pendant 8 min. Ajouter les oignons émincés et cuire 5 min à puissance 6.","Verser la bière, ajouter la cassonade et le pain d'épices tartiné de moutarde.","Couvrir et laisser mijoter à puissance 2 pendant 2 h.","Cuire les frites au four selon le paquet avant de servir."]},
{id:"b82",n:"Salade thaïe au bœuf",c:"Viande",t:25,i:[["Rumsteck",250,"g","viande"],["Salade verte",1,"","leg"],["Concombre",1,"","leg"],["Tomates cerises",150,"g","leg"],["Oignon rouge",1,"","leg"],["Coriandre",1,"botte","leg"],["Citron vert",1,"","leg"],["Sauce nuoc-mâm",2,"c. à s.","epi"],["Cacahuètes",30,"g","epi"]],s:["Saisir le bœuf entier dans une poêle très chaude à puissance 9, 3 min de chaque côté, puis le laisser reposer.","Préparer la sauce : nuoc-mâm, jus du citron vert et 1 c. à s. d'eau.","Mélanger la salade, le concombre, les tomates, l'oignon émincé et la coriandre.","Trancher finement le bœuf, le poser sur la salade, arroser de sauce et parsemer de cacahuètes."]},
{id:"b83",n:"Côtes de porc et purée de carottes",c:"Porc",t:35,i:[["Côtes de porc",2,"","viande"],["Carottes",5,"","leg"],["Pommes de terre",200,"g","leg"],["Beurre",20,"g","cremerie"],["Thym",1,"c. à c.","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire les carottes et les pommes de terre en morceaux dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min.","Les écraser avec le beurre, saler et poivrer.","Cuire les côtes dans l'huile avec le thym à puissance 7, 5 min de chaque côté.","Laisser reposer 2 min et servir avec la purée."]},
{id:"b84",n:"Porc au caramel et riz",c:"Porc",t:40,i:[["Échine de porc",400,"g","viande"],["Sucre",3,"c. à s.","plac"],["Sauce nuoc-mâm",2,"c. à s.","epi"],["Sauce soja",2,"c. à s.","epi"],["Oignon",1,"","leg"],["Ail",2,"gousse","leg"],["Riz basmati",150,"g","epi"]],s:["Couper le porc en cubes.","Dans une sauteuse, faire fondre le sucre avec 2 c. à s. d'eau à puissance 6 jusqu'à obtenir un caramel blond, environ 4 min.","Ajouter le porc, l'oignon et l'ail émincés, les sauces et 10 cl d'eau. Laisser mijoter à puissance 3 pendant 25 min en remuant.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:"b85",n:"Saucisses, purée et oignons confits",c:"Porc",t:35,i:[["Saucisses de Toulouse",2,"","viande"],["Pommes de terre",600,"g","leg"],["Oignon",2,"","leg"],["Lait",15,"cl","cremerie"],["Beurre",30,"g","cremerie"],["Bouillon de bœuf",1,"cube","epi"]],s:["Cuire les pommes de terre en morceaux dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min. Les écraser avec le lait et la moitié du beurre.","Cuire les saucisses à puissance 6 pendant 15 min en les retournant.","Faire fondre les oignons émincés dans le reste du beurre à puissance 4 pendant 15 min.","Ajouter 15 cl de bouillon aux oignons, laisser réduire 3 min à puissance 6 et servir sur les saucisses."]},
{id:"b86",n:"Porc aigre-doux à l'ananas et riz",c:"Porc",t:30,i:[["Filet mignon de porc",300,"g","viande"],["Poivron rouge",1,"","leg"],["Ananas en boîte",150,"g","epi"],["Oignon",1,"","leg"],["Sauce soja",2,"c. à s.","epi"],["Ketchup",2,"c. à s.","epi"],["Vinaigre",1,"c. à s.","plac"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Saisir le porc en dés dans l'huile à puissance 8 pendant 5 min.","Ajouter le poivron, l'oignon et l'ananas en morceaux, puis cuire 4 min.","Mélanger la sauce soja, le ketchup et le vinaigre, verser et laisser napper 2 min à puissance 5."]},
{id:"b87",n:"Penne au chorizo et aux poivrons",c:"Porc",t:20,i:[["Penne",200,"g","epi"],["Chorizo",100,"g","viande"],["Poivron rouge",1,"","leg"],["Coulis de tomate",200,"g","epi"],["Crème fraîche",10,"cl","cremerie"]],s:["Cuire les pâtes : puissance 9 jusqu'à ébullition, puis puissance 8 pendant 10 min.","Faire revenir le chorizo en dés et le poivron émincé à puissance 6 pendant 5 min.","Ajouter le coulis et la crème, puis laisser mijoter 5 min à puissance 3.","Mélanger avec les pâtes égouttées."]},
{id:"b88",n:"Croziflette",c:"Porc",t:45,i:[["Crozets",200,"g","epi"],["Lardons",150,"g","viande"],["Oignon",1,"","leg"],["Reblochon",1,"","cremerie"],["Crème fraîche",15,"cl","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 200 °C. Cuire les crozets dans l'eau salée : puissance 9 puis puissance 7 pendant 15 min.","Faire dorer les lardons et l'oignon émincé à puissance 7 pendant 6 min.","Mélanger crozets, lardons et crème dans un plat, puis poser le reblochon coupé en deux par-dessus.","Enfourner 20 min et servir avec la salade."]},
{id:"b89",n:"Rôti de porc et pommes de terre au four",c:"Porc",t:80,i:[["Rôti de porc",600,"g","viande"],["Pommes de terre",600,"g","leg"],["Oignon",2,"","leg"],["Ail",3,"gousse","leg"],["Thym",1,"c. à c.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four à 190 °C.","Dorer le rôti sur toutes les faces dans l'huile à puissance 8 pendant 6 min.","Le placer dans un plat entouré des pommes de terre en quartiers, des oignons, de l'ail et du thym. Ajouter 10 cl d'eau.","Enfourner 1 h en arrosant de temps en temps, puis laisser reposer 10 min avant de trancher."]},
{id:"b90",n:"Quiche aux poireaux et lardons",c:"Porc",t:50,i:[["Pâte brisée",1,"rouleau","cremerie"],["Poireaux",2,"","leg"],["Lardons",100,"g","viande"],["Œufs",3,"","cremerie"],["Crème fraîche",20,"cl","cremerie"],["Emmental râpé",50,"g","cremerie"],["Beurre",10,"g","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 180 °C et garnir un moule avec la pâte.","Faire fondre les poireaux émincés et les lardons dans le beurre à puissance 5 pendant 10 min.","Battre les œufs avec la crème et poivrer, puis ajouter les poireaux, les lardons et le fromage.","Verser sur la pâte et enfourner 35 min. Servir avec la salade."]},
{id:"b91",n:"Potée au chou",c:"Porc",t:120,i:[["Chou vert",1,"","leg"],["Saucisse de Morteau",1,"","viande"],["Lard fumé",200,"g","viande"],["Carottes",3,"","leg"],["Pommes de terre",500,"g","leg"],["Navet",1,"","leg"],["Bouquet garni",1,"","epi"]],s:["Couper le chou en quartiers et le blanchir 5 min dans l'eau bouillante à puissance 9, puis l'égoutter.","Dans une grande cocotte, mettre le lard, le chou, les carottes, le navet et le bouquet garni, puis couvrir d'eau.","Porter à ébullition à puissance 9, puis laisser mijoter à puissance 3 pendant 1 h.","Ajouter la saucisse et les pommes de terre, puis cuire encore 40 min."]},
{id:"b92",n:"Tagliatelles crème, jambon et petits pois",c:"Porc",t:20,i:[["Tagliatelles",200,"g","epi"],["Jambon blanc",3,"tranche","viande"],["Petits pois surgelés",150,"g","surg"],["Crème fraîche",15,"cl","cremerie"],["Parmesan",30,"g","cremerie"]],s:["Cuire les tagliatelles dans l'eau salée : puissance 9 puis puissance 8, en ajoutant les petits pois pour les 4 dernières minutes.","Couper le jambon en lanières.","Chauffer la crème avec le jambon à puissance 3 pendant 3 min.","Mélanger avec les pâtes et les petits pois égouttés, puis parsemer de parmesan."]},
{id:"b93",n:"Tortilla au chorizo",c:"Porc",t:35,i:[["Pommes de terre",400,"g","leg"],["Œufs",5,"","cremerie"],["Chorizo",60,"g","viande"],["Oignon",1,"","leg"],["Salade verte",1,"","leg"],["Huile d'olive",3,"c. à s.","plac"]],s:["Couper les pommes de terre en fines rondelles et l'oignon en lamelles. Les cuire dans l'huile à puissance 5, à couvert, pendant 15 min.","Battre les œufs, puis ajouter les pommes de terre, l'oignon et le chorizo en dés.","Verser dans la poêle et cuire à puissance 4, à couvert, pendant 8 min.","Retourner la tortilla à l'aide d'une assiette et cuire encore 3 min. Servir avec la salade."]},
{id:"b94",n:"Feuilleté jambon fromage et salade",c:"Porc",t:35,i:[["Pâte feuilletée",1,"rouleau","cremerie"],["Jambon blanc",4,"tranche","viande"],["Emmental en tranches",4,"tranche","cremerie"],["Œufs",1,"","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 200 °C.","Dérouler la pâte, garnir une moitié de jambon et de fromage, puis replier et souder les bords.","Badigeonner d'œuf battu et enfourner 25 min.","Servir avec la salade."]},
{id:"b95",n:"Papillotes de saumon aux poireaux et riz",c:"Poisson",t:30,i:[["Pavés de saumon",2,"","viande"],["Poireaux",2,"","leg"],["Crème fraîche",10,"cl","cremerie"],["Citron",1,"","leg"],["Riz basmati",150,"g","epi"],["Beurre",10,"g","cremerie"]],s:["Préchauffer le four à 200 °C. Faire fondre les poireaux émincés dans le beurre à puissance 5 pendant 8 min, puis ajouter la crème.","Sur deux feuilles de papier cuisson, déposer les poireaux, le saumon et une rondelle de citron, puis fermer les papillotes.","Enfourner 15 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:"b96",n:"Colin pané au four et purée",c:"Poisson",t:35,i:[["Filets de colin",2,"","viande"],["Chapelure",50,"g","epi"],["Œufs",1,"","cremerie"],["Pommes de terre",500,"g","leg"],["Lait",15,"cl","cremerie"],["Beurre",25,"g","cremerie"],["Citron",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire les pommes de terre en morceaux dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min, puis les écraser avec le lait et le beurre.","Préchauffer le four à 210 °C. Passer le colin dans l'œuf battu puis dans la chapelure.","Poser les filets sur une plaque huilée et enfourner 15 min.","Servir avec la purée et des quartiers de citron."]},
{id:"b97",n:"Curry de crevettes au lait de coco",c:"Poisson",t:25,i:[["Crevettes décortiquées",250,"g","viande"],["Lait de coco",20,"cl","epi"],["Tomates concassées",200,"g","epi"],["Oignon",1,"","leg"],["Pâte de curry",1,"c. à s.","epi"],["Riz basmati",150,"g","epi"],["Coriandre",1,"botte","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Faire revenir l'oignon émincé dans l'huile à puissance 6 pendant 3 min, puis ajouter la pâte de curry 1 min.","Verser le lait de coco et les tomates, puis laisser mijoter à puissance 4 pendant 8 min.","Ajouter les crevettes et cuire 4 min. Parsemer de coriandre."]},
{id:"b98",n:"Paella express poulet et crevettes",c:"Poisson",t:40,i:[["Riz rond",160,"g","epi"],["Crevettes décortiquées",150,"g","viande"],["Blancs de poulet",150,"g","viande"],["Chorizo",50,"g","viande"],["Poivron rouge",1,"","leg"],["Petits pois surgelés",100,"g","surg"],["Bouillon de volaille",1,"cube","epi"],["Safran",1,"pincée","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Dorer le poulet en dés et le chorizo dans l'huile à puissance 7 pendant 5 min, puis ajouter le poivron et cuire 3 min.","Ajouter le riz, le safran et 50 cl de bouillon. Porter à ébullition à puissance 8.","Baisser à puissance 3 et cuire 15 min sans remuer.","Ajouter les crevettes et les petits pois, couvrir et cuire encore 5 min."]},
{id:"b99",n:"Thon au sésame et nouilles sautées",c:"Poisson",t:25,i:[["Steaks de thon",2,"","viande"],["Graines de sésame",2,"c. à s.","epi"],["Nouilles chinoises",150,"g","epi"],["Carottes",1,"","leg"],["Poivron rouge",1,"","leg"],["Sauce soja",3,"c. à s.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire les nouilles selon le paquet, puis les égoutter.","Faire sauter les légumes en lanières dans 1 c. à s. d'huile à puissance 8 pendant 4 min, puis ajouter les nouilles et 2 c. à s. de sauce soja.","Enrober le thon de sésame et le saisir dans le reste d'huile à puissance 8, 1 min de chaque côté.","Trancher le thon et le servir sur les nouilles avec le reste de sauce soja."]},
{id:"b100",n:"Lieu noir à la fondue de poireaux",c:"Poisson",t:30,i:[["Filets de lieu noir",2,"","viande"],["Poireaux",3,"","leg"],["Crème fraîche",15,"cl","cremerie"],["Pommes de terre",400,"g","leg"],["Beurre",15,"g","cremerie"]],s:["Cuire les pommes de terre dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min.","Faire fondre les poireaux émincés dans le beurre à puissance 4 pendant 12 min, puis ajouter la crème.","Poser les filets sur les poireaux, couvrir et cuire à puissance 3 pendant 8 min.","Servir avec les pommes de terre."]},
{id:"b101",n:"Poke bowl au saumon",c:"Poisson",t:25,i:[["Saumon frais",250,"g","viande"],["Riz rond",150,"g","epi"],["Avocat",1,"","leg"],["Concombre",1,"","leg"],["Edamame surgelés",100,"g","surg"],["Sauce soja",3,"c. à s.","epi"],["Graines de sésame",1,"c. à s.","epi"],["Vinaigre",1,"c. à s.","plac"]],s:["Cuire le riz dans 1,5 fois son volume d'eau : puissance 9 puis puissance 2 à couvert pendant 12 min. L'assaisonner de vinaigre et le laisser tiédir.","Cuire les edamame dans l'eau bouillante à puissance 9 pendant 4 min.","Couper le saumon en cubes et le laisser mariner 5 min dans la sauce soja.","Dresser les bols : riz, saumon, avocat, concombre, edamame et sésame."]},
{id:"b102",n:"Risotto aux crevettes et au citron",c:"Poisson",t:35,i:[["Riz arborio",160,"g","epi"],["Crevettes décortiquées",200,"g","viande"],["Échalote",1,"","leg"],["Bouillon de légumes",1,"cube","epi"],["Vin blanc",10,"cl","epi"],["Citron",1,"","leg"],["Parmesan",30,"g","cremerie"],["Beurre",20,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Préparer 75 cl de bouillon avec le cube et le garder chaud à puissance 2.","Faire revenir l'échalote dans l'huile à puissance 6 pendant 2 min, ajouter le riz 2 min, puis le vin blanc.","Ajouter le bouillon louche par louche à puissance 5 pendant 18 min, avec les crevettes et le zeste du citron pour les 4 dernières minutes.","Hors du feu, incorporer le beurre et le parmesan."]},
{id:"b103",n:"Parmentier de poisson",c:"Poisson",t:50,i:[["Dos de cabillaud",2,"","viande"],["Pommes de terre",600,"g","leg"],["Lait",20,"cl","cremerie"],["Beurre",30,"g","cremerie"],["Emmental râpé",40,"g","cremerie"],["Persil",1,"botte","leg"]],s:["Cuire les pommes de terre dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min. Préchauffer le four à 200 °C.","Pocher le cabillaud dans le lait à puissance 3 pendant 8 min, puis l'émietter.","Écraser les pommes de terre avec le beurre et un peu du lait de cuisson.","Étaler le poisson et le persil dans un plat, couvrir de purée et de fromage, puis enfourner 20 min."]},
{id:"b104",n:"Spaghetti au thon et à la tomate",c:"Poisson",t:20,i:[["Spaghetti",200,"g","epi"],["Thon en boîte",140,"g","epi"],["Coulis de tomate",300,"g","epi"],["Ail",1,"gousse","leg"],["Câpres",1,"c. à s.","epi"],["Persil",1,"botte","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire les spaghetti : puissance 9 jusqu'à ébullition, puis puissance 8 pendant 10 min.","Faire revenir l'ail dans l'huile à puissance 5 pendant 1 min, puis ajouter le coulis et les câpres.","Laisser mijoter à puissance 3 pendant 8 min, puis ajouter le thon émietté.","Mélanger avec les pâtes et le persil ciselé."]},
{id:"b105",n:"Quiche au saumon et aux épinards",c:"Poisson",t:50,i:[["Pâte brisée",1,"rouleau","cremerie"],["Saumon fumé",100,"g","viande"],["Épinards surgelés",200,"g","surg"],["Œufs",3,"","cremerie"],["Crème fraîche",20,"cl","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 180 °C et garnir un moule avec la pâte.","Faire décongeler les épinards à puissance 5 pendant 5 min, puis bien les égoutter.","Battre les œufs avec la crème, ajouter les épinards et le saumon en lanières, puis poivrer.","Verser sur la pâte et enfourner 35 min. Servir avec la salade."]},
{id:"b106",n:"Gratin de cabillaud et brocoli",c:"Poisson",t:40,i:[["Dos de cabillaud",2,"","viande"],["Brocoli",1,"","leg"],["Béchamel",30,"cl","epi"],["Emmental râpé",50,"g","cremerie"],["Riz basmati",120,"g","epi"]],s:["Préchauffer le four à 200 °C. Cuire le brocoli en bouquets dans l'eau bouillante à puissance 9 pendant 5 min.","Disposer le poisson en morceaux et le brocoli dans un plat, napper de béchamel et parsemer de fromage.","Enfourner 25 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:"b107",n:"Cabillaud au chorizo et pommes de terre",c:"Poisson",t:40,i:[["Dos de cabillaud",2,"","viande"],["Chorizo",60,"g","viande"],["Pommes de terre",500,"g","leg"],["Tomates cerises",200,"g","leg"],["Ail",2,"gousse","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C. Couper les pommes de terre en rondelles et les mélanger avec l'huile et l'ail émincé.","Enfourner 20 min.","Ajouter le cabillaud, les tomates cerises et le chorizo en rondelles sur les pommes de terre.","Remettre au four 15 min."]},
{id:"b108",n:"Salade niçoise",c:"Poisson",t:25,i:[["Thon en boîte",140,"g","epi"],["Œufs",2,"","cremerie"],["Haricots verts surgelés",200,"g","surg"],["Pommes de terre",300,"g","leg"],["Tomates",2,"","leg"],["Olives noires",40,"g","epi"],["Salade verte",1,"","leg"],["Huile d'olive",3,"c. à s.","plac"],["Vinaigre",1,"c. à s.","plac"]],s:["Cuire les pommes de terre dans l'eau salée : puissance 9 puis puissance 7 pendant 15 min, en ajoutant les haricots verts pour les 8 dernières minutes.","Cuire les œufs dans l'eau bouillante à puissance 9 pendant 9 min, puis les refroidir et les écaler.","Préparer une vinaigrette avec l'huile, le vinaigre, du sel et du poivre.","Assembler la salade, les légumes, les tomates, le thon, les olives et les œufs coupés, puis assaisonner."]},
{id:"b109",n:"Dorade au four et fenouil rôti",c:"Poisson",t:40,i:[["Filets de dorade",2,"","viande"],["Fenouil",2,"","leg"],["Citron",1,"","leg"],["Pommes de terre grenaille",400,"g","leg"],["Huile d'olive",3,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C. Couper le fenouil en lamelles et les grenailles en deux, puis les mélanger avec 2 c. à s. d'huile.","Enfourner 25 min.","Poser les filets de dorade sur les légumes, arroser du reste d'huile et du jus de citron.","Remettre au four 12 min."]},
{id:"b110",n:"Tacos de poisson et chou croquant",c:"Poisson",t:25,i:[["Filets de colin",2,"","viande"],["Tortillas",6,"","epi"],["Chou rouge",200,"g","leg"],["Fromage blanc",100,"g","cremerie"],["Citron vert",1,"","leg"],["Épices fajitas",1,"c. à s.","epi"],["Coriandre",1,"botte","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Émincer finement le chou et le mélanger avec le jus du citron vert et une pincée de sel.","Saupoudrer le colin d'épices et le cuire dans l'huile à puissance 7, 3 min de chaque côté, puis l'émietter.","Réchauffer les tortillas 30 secondes à sec à puissance 6.","Garnir de chou, de poisson, de fromage blanc et de coriandre."]},
{id:"b111",n:"Lasagnes épinards et ricotta",c:"Végé",t:60,i:[["Feuilles de lasagne",9,"","epi"],["Épinards surgelés",400,"g","surg"],["Ricotta",250,"g","cremerie"],["Coulis de tomate",400,"g","epi"],["Mozzarella",1,"boule","cremerie"],["Parmesan",30,"g","cremerie"],["Ail",1,"gousse","leg"]],s:["Préchauffer le four à 180 °C. Faire décongeler les épinards avec l'ail à puissance 5 pendant 6 min, puis bien les égoutter.","Mélanger les épinards avec la ricotta, du sel et du poivre.","Dans un plat, alterner coulis, feuilles et mélange aux épinards sur 3 couches.","Terminer par le coulis, la mozzarella et le parmesan, puis enfourner 35 min."]},
{id:"b112",n:"Penne alla norma",c:"Végé",t:30,i:[["Aubergines",1,"","leg"],["Penne",200,"g","epi"],["Coulis de tomate",400,"g","epi"],["Ail",1,"gousse","leg"],["Mozzarella",1,"boule","cremerie"],["Basilic",1,"botte","leg"],["Huile d'olive",3,"c. à s.","plac"]],s:["Couper l'aubergine en dés et la faire dorer dans l'huile à puissance 7 pendant 10 min.","Ajouter l'ail et le coulis, puis laisser mijoter à puissance 3 pendant 10 min.","Cuire les pâtes : puissance 9 puis puissance 8 pendant 10 min.","Mélanger les pâtes avec la sauce, puis ajouter la mozzarella en dés et le basilic."]},
{id:"b113",n:"Ratatouille et semoule",c:"Végé",t:50,i:[["Aubergines",1,"","leg"],["Courgettes",2,"","leg"],["Poivron rouge",1,"","leg"],["Tomates concassées",400,"g","epi"],["Oignon",1,"","leg"],["Ail",2,"gousse","leg"],["Herbes de Provence",1,"c. à c.","epi"],["Semoule",150,"g","epi"],["Huile d'olive",3,"c. à s.","plac"]],s:["Couper tous les légumes en dés.","Faire revenir l'oignon et l'ail dans l'huile à puissance 6 pendant 3 min, ajouter l'aubergine, les courgettes et le poivron, puis cuire 8 min à puissance 7.","Ajouter les tomates et les herbes, couvrir et laisser mijoter à puissance 3 pendant 30 min.","Préparer la semoule avec le même volume d'eau bouillante salée, laisser gonfler 5 min puis égrainer."]},
{id:"b114",n:"Chili sin carne",c:"Végé",t:35,i:[["Haricots rouges en boîte",400,"g","epi"],["Maïs en boîte",150,"g","epi"],["Tomates concassées",400,"g","epi"],["Poivron rouge",1,"","leg"],["Oignon",1,"","leg"],["Épices chili",1,"c. à c.","epi"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Faire revenir l'oignon et le poivron en dés dans l'huile à puissance 6 pendant 5 min.","Ajouter les épices, les tomates, les haricots rincés et le maïs.","Laisser mijoter à puissance 4 pendant 20 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:"b115",n:"Soupe à l'oignon gratinée",c:"Végé",t:50,i:[["Oignon",4,"","leg"],["Beurre",30,"g","cremerie"],["Farine",1,"c. à s.","plac"],["Bouillon de légumes",1,"cube","epi"],["Vin blanc",10,"cl","epi"],["Baguette",1,"","pain"],["Emmental râpé",80,"g","cremerie"]],s:["Émincer les oignons et les faire fondre dans le beurre à puissance 4 pendant 20 min, jusqu'à ce qu'ils soient bien dorés.","Saupoudrer de farine, mélanger, puis verser le vin blanc et 80 cl de bouillon préparé avec le cube.","Laisser mijoter à puissance 3 pendant 15 min.","Verser dans des bols allant au four, couvrir de tranches de pain et de fromage, puis passer 5 min sous le gril."]},
{id:"b116",n:"Burger végétarien aux haricots rouges",c:"Végé",t:35,i:[["Haricots rouges en boîte",400,"g","epi"],["Chapelure",50,"g","epi"],["Œufs",1,"","cremerie"],["Cumin",1,"c. à c.","epi"],["Pains à burger",2,"","pain"],["Cheddar en tranches",2,"tranche","cremerie"],["Tomates",1,"","leg"],["Salade verte",1,"","leg"],["Potatoes surgelées",300,"g","surg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four et cuire les potatoes selon le paquet, environ 25 min.","Écraser les haricots égouttés avec l'œuf, la chapelure et le cumin, puis former 2 galettes.","Les cuire dans l'huile à puissance 6, 4 min de chaque côté, avec le cheddar dessus pendant la dernière minute.","Monter les burgers avec la salade et la tomate."]},
{id:"b117",n:"Curry thaï de légumes",c:"Végé",t:30,i:[["Lait de coco",40,"cl","epi"],["Pâte de curry",1,"c. à s.","epi"],["Patate douce",1,"","leg"],["Brocoli",1,"","leg"],["Poivron rouge",1,"","leg"],["Pois chiches en boîte",250,"g","epi"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Faire revenir la pâte de curry dans l'huile à puissance 6 pendant 1 min, puis verser le lait de coco.","Ajouter la patate douce en cubes et cuire à puissance 4 pendant 10 min.","Ajouter le brocoli, le poivron et les pois chiches, puis cuire encore 8 min."]},
{id:"b118",n:"Gratin de butternut",c:"Végé",t:50,i:[["Courge butternut",1,"","leg"],["Crème fraîche",20,"cl","cremerie"],["Ail",1,"gousse","leg"],["Emmental râpé",60,"g","cremerie"],["Muscade",1,"pincée","plac"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 190 °C. Éplucher la courge et la couper en fines tranches.","Mélanger la crème avec l'ail écrasé, la muscade, du sel et du poivre.","Disposer la courge dans un plat, napper de crème et parsemer de fromage.","Enfourner 40 min et servir avec la salade."]},
{id:"b119",n:"Risotto au potiron",c:"Végé",t:40,i:[["Riz arborio",160,"g","epi"],["Potiron",400,"g","leg"],["Oignon",1,"","leg"],["Bouillon de légumes",1,"cube","epi"],["Parmesan",40,"g","cremerie"],["Beurre",20,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Préparer 80 cl de bouillon avec le cube et le garder chaud à puissance 2.","Faire revenir l'oignon et le potiron en petits dés dans l'huile à puissance 6 pendant 6 min.","Ajouter le riz 2 min, puis le bouillon louche par louche à puissance 5 pendant 18 min.","Hors du feu, incorporer le beurre et le parmesan."]},
{id:"b120",n:"Falafels, houmous et pain pita",c:"Végé",t:20,i:[["Falafels",12,"","cremerie"],["Houmous",150,"g","cremerie"],["Pains pita",2,"","pain"],["Tomates",2,"","leg"],["Concombre",1,"","leg"],["Salade verte",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Réchauffer les falafels dans l'huile à puissance 6 pendant 6 min en les retournant.","Couper les tomates et le concombre en dés, émincer la salade.","Toaster les pains pita à sec à puissance 6, 1 min de chaque côté.","Garnir les pitas de houmous, de crudités et de falafels."]},
{id:"b121",n:"Tarte aux légumes et au chèvre",c:"Végé",t:50,i:[["Pâte brisée",1,"rouleau","cremerie"],["Courgettes",1,"","leg"],["Tomates",2,"","leg"],["Fromage de chèvre",120,"g","cremerie"],["Œufs",2,"","cremerie"],["Crème fraîche",15,"cl","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 190 °C et garnir un moule avec la pâte.","Couper la courgette et les tomates en rondelles, le chèvre en tranches.","Battre les œufs avec la crème, disposer les légumes et le chèvre sur la pâte, puis verser l'appareil.","Enfourner 35 min et servir avec la salade."]},
{id:"b122",n:"Spaghetti cacio e pepe",c:"Végé",t:15,i:[["Spaghetti",200,"g","epi"],["Parmesan",60,"g","cremerie"],["Beurre",15,"g","cremerie"],["Poivre",null,"","plac"]],s:["Cuire les spaghetti : puissance 9 puis puissance 8 pendant 10 min, en gardant un verre d'eau de cuisson.","Râper finement le fromage et le mélanger avec beaucoup de poivre.","Remettre les pâtes dans la casserole hors du feu avec le beurre et 5 c. à s. d'eau de cuisson.","Ajouter le fromage petit à petit en mélangeant vivement jusqu'à obtenir une sauce crémeuse."]},
{id:"b123",n:"Velouté de carottes au cumin et tartines au chèvre",c:"Végé",t:35,i:[["Carottes",6,"","leg"],["Pommes de terre",150,"g","leg"],["Oignon",1,"","leg"],["Cumin",1,"c. à c.","epi"],["Bouillon de légumes",1,"cube","epi"],["Crème fraîche",10,"cl","cremerie"],["Pain de campagne",4,"tranche","pain"],["Fromage de chèvre",80,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Faire revenir l'oignon émincé dans l'huile à puissance 6 pendant 3 min, puis ajouter le cumin.","Ajouter les carottes et la pomme de terre en morceaux, le cube et 80 cl d'eau. Porter à ébullition à puissance 9, puis cuire à puissance 5 pendant 25 min.","Mixer avec la crème.","Faire griller les tartines garnies de chèvre 5 min sous le gril du four."]},
{id:"b124",n:"Gnocchis au gorgonzola et aux épinards",c:"Végé",t:20,i:[["Gnocchis",500,"g","cremerie"],["Gorgonzola",100,"g","cremerie"],["Crème fraîche",10,"cl","cremerie"],["Jeunes pousses",100,"g","leg"],["Noix",30,"g","epi"]],s:["Cuire les gnocchis dans l'eau bouillante à puissance 9 jusqu'à ce qu'ils remontent, environ 2 min.","Faire fondre le gorgonzola dans la crème à puissance 3 pendant 3 min.","Ajouter les pousses et les laisser tomber 1 min.","Mélanger avec les gnocchis égouttés et parsemer de noix concassées."]},
{id:"b125",n:"Röstis de pommes de terre et salade",c:"Végé",t:35,i:[["Pommes de terre",500,"g","leg"],["Œufs",1,"","cremerie"],["Oignon",1,"","leg"],["Fromage blanc",100,"g","cremerie"],["Ciboulette",1,"botte","leg"],["Salade verte",1,"","leg"],["Huile d'olive",3,"c. à s.","plac"]],s:["Râper les pommes de terre et l'oignon, puis bien les presser pour retirer l'eau.","Mélanger avec l'œuf, du sel et du poivre.","Former des galettes et les cuire dans l'huile à puissance 6, 5 min de chaque côté.","Servir avec le fromage blanc à la ciboulette et la salade."]},
{id:"b126",n:"Poêlée de quinoa, légumes et feta",c:"Végé",t:30,i:[["Quinoa",150,"g","epi"],["Courgettes",1,"","leg"],["Poivron rouge",1,"","leg"],["Tomates cerises",150,"g","leg"],["Feta",100,"g","cremerie"],["Menthe",1,"botte","leg"],["Citron",1,"","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire le quinoa dans 2 fois son volume d'eau : puissance 9 puis puissance 3 à couvert pendant 12 min.","Faire sauter la courgette et le poivron en dés dans l'huile à puissance 7 pendant 6 min.","Ajouter le quinoa et les tomates cerises coupées en deux, puis mélanger 2 min.","Hors du feu, ajouter la feta émiettée, la menthe et le jus du citron."]},
{id:"b127",n:"Wok de tofu et légumes",c:"Végé",t:25,i:[["Tofu ferme",200,"g","cremerie"],["Brocoli",1,"","leg"],["Carottes",1,"","leg"],["Poivron rouge",1,"","leg"],["Sauce soja",3,"c. à s.","epi"],["Gingembre frais",10,"g","leg"],["Nouilles chinoises",150,"g","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire les nouilles selon le paquet, puis les égoutter.","Couper le tofu en dés et le dorer dans l'huile à puissance 8 pendant 6 min, puis le réserver.","Faire sauter les légumes et le gingembre râpé à puissance 8 pendant 5 min.","Ajouter les nouilles, le tofu et la sauce soja, puis mélanger 2 min."]},
{id:"b128",n:"Pizza margherita",c:"Végé",t:25,i:[["Pâte à pizza",1,"rouleau","cremerie"],["Coulis de tomate",150,"g","epi"],["Mozzarella",1,"boule","cremerie"],["Basilic",1,"botte","leg"],["Salade verte",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Préchauffer le four à 240 °C.","Dérouler la pâte sur la plaque et étaler le coulis.","Répartir la mozzarella en morceaux et arroser d'un filet d'huile.","Enfourner 12 min, puis ajouter le basilic. Servir avec la salade."]},
{id:"b129",n:"Tartines chèvre, miel et noix",c:"Végé",t:20,i:[["Pain de campagne",4,"tranche","pain"],["Fromage de chèvre",150,"g","cremerie"],["Miel",2,"c. à s.","epi"],["Noix",30,"g","epi"],["Salade verte",1,"","leg"],["Huile d'olive",2,"c. à s.","plac"],["Vinaigre",1,"c. à s.","plac"]],s:["Préchauffer le four en position gril.","Garnir les tranches de pain de chèvre, arroser de miel et parsemer de noix.","Enfourner 6 min, jusqu'à ce que le fromage dore.","Servir avec la salade assaisonnée d'huile et de vinaigre."]},
{id:"b130",n:"Crêpes salées aux épinards et au fromage",c:"Végé",t:30,i:[["Farine",125,"g","plac"],["Œufs",2,"","cremerie"],["Lait",25,"cl","cremerie"],["Épinards surgelés",300,"g","surg"],["Emmental râpé",80,"g","cremerie"],["Crème fraîche",10,"cl","cremerie"],["Beurre",20,"g","cremerie"]],s:["Fouetter la farine, les œufs et le lait jusqu'à obtenir une pâte lisse.","Faire décongeler les épinards à puissance 5 pendant 6 min, les égoutter et ajouter la crème.","Cuire les crêpes dans une poêle beurrée à puissance 7, 1 min de chaque côté.","Garnir chaque crêpe d'épinards et de fromage, la plier et la réchauffer 1 min à puissance 5."]},
{id:"b131",n:"Poivrons farcis au quinoa et à la feta",c:"Végé",t:50,i:[["Poivron rouge",2,"","leg"],["Poivron jaune",2,"","leg"],["Quinoa",100,"g","epi"],["Feta",100,"g","cremerie"],["Tomates concassées",200,"g","epi"],["Oignon",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Préchauffer le four à 190 °C. Cuire le quinoa : puissance 9 puis puissance 3 à couvert pendant 12 min.","Faire revenir l'oignon dans l'huile à puissance 6 pendant 3 min, puis ajouter les tomates et le quinoa.","Couper le haut des poivrons, les épépiner et les farcir avec le mélange et la feta émiettée.","Enfourner 35 min."]},
{id:"b132",n:"Orecchiette au brocoli et parmesan",c:"Végé",t:20,i:[["Orecchiette",200,"g","epi"],["Brocoli",1,"","leg"],["Ail",2,"gousse","leg"],["Piment d'Espelette",1,"pincée","epi"],["Parmesan",40,"g","cremerie"],["Huile d'olive",3,"c. à s.","plac"]],s:["Cuire les orecchiette dans l'eau salée : puissance 9 puis puissance 8, en ajoutant le brocoli en petits bouquets pour les 5 dernières minutes.","Faire revenir l'ail émincé et le piment dans l'huile à puissance 4 pendant 2 min.","Égoutter les pâtes et le brocoli, puis les mélanger dans la poêle 1 min à puissance 5.","Servir avec le parmesan râpé."]},
{id:"b133",n:"Ramen végétarien",c:"Végé",t:25,i:[["Nouilles chinoises",150,"g","epi"],["Bouillon de légumes",2,"cube","epi"],["Sauce soja",3,"c. à s.","epi"],["Champignons de Paris",150,"g","leg"],["Tofu ferme",150,"g","cremerie"],["Œufs",2,"","cremerie"],["Oignons nouveaux",2,"","leg"],["Gingembre frais",10,"g","leg"]],s:["Cuire les œufs dans l'eau bouillante à puissance 9 pendant 6 min, puis les refroidir et les écaler.","Porter 1 l d'eau à ébullition avec les cubes, la sauce soja et le gingembre râpé à puissance 9, puis baisser à puissance 4.","Ajouter les champignons émincés et le tofu en dés, puis cuire 5 min.","Cuire les nouilles 3 min dans le bouillon et servir avec les œufs et les oignons nouveaux."]},
{id:"b134",n:"Salade de pâtes à la grecque",c:"Végé",t:20,i:[["Penne",200,"g","epi"],["Feta",100,"g","cremerie"],["Tomates cerises",200,"g","leg"],["Concombre",1,"","leg"],["Olives noires",50,"g","epi"],["Oignon rouge",1,"","leg"],["Huile d'olive",3,"c. à s.","plac"],["Vinaigre",1,"c. à s.","plac"]],s:["Cuire les pâtes : puissance 9 puis puissance 8 pendant 10 min, puis les rincer à l'eau froide.","Couper les tomates, le concombre et l'oignon.","Préparer une vinaigrette avec l'huile, le vinaigre, du sel et du poivre.","Mélanger le tout avec la feta en dés et les olives."]},
{id:"b135",n:"Mac and cheese",c:"Végé",t:35,i:[["Coquillettes",200,"g","epi"],["Lait",30,"cl","cremerie"],["Beurre",25,"g","cremerie"],["Farine",2,"c. à s.","plac"],["Cheddar râpé",120,"g","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 200 °C. Cuire les pâtes : puissance 9 puis puissance 8, 2 min de moins que le temps indiqué.","Faire fondre le beurre à puissance 4, ajouter la farine et mélanger 1 min, puis verser le lait en fouettant jusqu'à épaississement, environ 4 min.","Hors du feu, ajouter les deux tiers du fromage, puis les pâtes égouttées.","Verser dans un plat, couvrir du reste de fromage et enfourner 15 min."]},
{id:"b136",n:"Gratin de brocoli au chèvre",c:"Végé",t:40,i:[["Brocoli",1,"","leg"],["Pommes de terre",300,"g","leg"],["Béchamel",30,"cl","epi"],["Fromage de chèvre",100,"g","cremerie"],["Emmental râpé",40,"g","cremerie"]],s:["Préchauffer le four à 200 °C. Cuire les pommes de terre en rondelles et le brocoli en bouquets dans l'eau bouillante : puissance 9 puis puissance 7 pendant 10 min.","Égoutter et disposer dans un plat.","Napper de béchamel, puis ajouter le chèvre en morceaux et le fromage râpé.","Enfourner 20 min."]},
{id:"b137",n:"Tian de légumes et riz",c:"Végé",t:60,i:[["Courgettes",2,"","leg"],["Tomates",3,"","leg"],["Aubergines",1,"","leg"],["Oignon",1,"","leg"],["Herbes de Provence",1,"c. à c.","epi"],["Riz basmati",120,"g","epi"],["Huile d'olive",3,"c. à s.","plac"]],s:["Préchauffer le four à 180 °C. Émincer l'oignon et le répartir au fond d'un plat.","Couper les légumes en rondelles et les disposer debout dans le plat, en les alternant.","Arroser d'huile, parsemer d'herbes, saler et enfourner 50 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:"b138",n:"Bolognaise de lentilles",c:"Végé",t:35,i:[["Lentilles corail",120,"g","epi"],["Coulis de tomate",500,"g","epi"],["Carottes",1,"","leg"],["Oignon",1,"","leg"],["Ail",1,"gousse","leg"],["Spaghetti",200,"g","epi"],["Parmesan",30,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Faire revenir l'oignon, la carotte et l'ail hachés dans l'huile à puissance 6 pendant 5 min.","Ajouter les lentilles rincées, le coulis et 25 cl d'eau.","Laisser mijoter à puissance 4 pendant 20 min en remuant.","Cuire les spaghetti : puissance 9 puis puissance 8 pendant 10 min. Servir avec le parmesan."]},
{id:"b139",n:"Œufs brouillés crémeux, tartines et salade",c:"Œufs",t:15,i:[["Œufs",5,"","cremerie"],["Beurre",15,"g","cremerie"],["Crème fraîche",5,"cl","cremerie"],["Ciboulette",1,"botte","leg"],["Pain de campagne",4,"tranche","pain"],["Salade verte",1,"","leg"]],s:["Battre les œufs avec du sel et du poivre.","Faire fondre le beurre à puissance 3 et verser les œufs. Remuer sans arrêt pendant 4 min, jusqu'à ce qu'ils soient crémeux.","Hors du feu, ajouter la crème et la ciboulette ciselée.","Servir sur les tartines grillées avec la salade."]},
{id:"b140",n:"Frittata aux courgettes et à la feta",c:"Œufs",t:25,i:[["Œufs",6,"","cremerie"],["Courgettes",2,"","leg"],["Feta",100,"g","cremerie"],["Menthe",1,"botte","leg"],["Salade verte",1,"","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Râper les courgettes et les faire revenir dans l'huile à puissance 6 pendant 5 min.","Battre les œufs, puis ajouter la feta émiettée et la menthe ciselée.","Verser sur les courgettes, couvrir et cuire à puissance 4 pendant 10 min.","Servir en parts avec la salade."]},
{id:"b141",n:"Quiche aux épinards et au chèvre",c:"Œufs",t:50,i:[["Pâte brisée",1,"rouleau","cremerie"],["Épinards surgelés",300,"g","surg"],["Fromage de chèvre",120,"g","cremerie"],["Œufs",3,"","cremerie"],["Crème fraîche",20,"cl","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 180 °C et garnir un moule avec la pâte.","Faire décongeler les épinards à puissance 5 pendant 6 min, puis bien les égoutter.","Battre les œufs avec la crème, puis ajouter les épinards et le chèvre émietté.","Verser sur la pâte et enfourner 35 min. Servir avec la salade."]},
{id:"b142",n:"Œufs à la florentine",c:"Œufs",t:20,i:[["Œufs",4,"","cremerie"],["Épinards surgelés",300,"g","surg"],["Crème fraîche",10,"cl","cremerie"],["Emmental râpé",40,"g","cremerie"],["Pain de campagne",4,"tranche","pain"]],s:["Préchauffer le four à 200 °C. Faire décongeler les épinards à puissance 5 pendant 6 min, les égoutter et ajouter la crème.","Répartir les épinards dans un plat, creuser 4 puits et y casser les œufs.","Parsemer de fromage et enfourner 10 min.","Servir avec le pain grillé."]},
{id:"b143",n:"Tortilla de patatas",c:"Œufs",t:35,i:[["Pommes de terre",400,"g","leg"],["Œufs",5,"","cremerie"],["Oignon",1,"","leg"],["Salade verte",1,"","leg"],["Huile d'olive",4,"c. à s.","plac"]],s:["Couper les pommes de terre en fines rondelles et l'oignon en lamelles. Les cuire dans l'huile à puissance 5, à couvert, pendant 15 min.","Battre les œufs avec du sel, puis ajouter les pommes de terre et l'oignon égouttés.","Verser dans la poêle et cuire à puissance 4, à couvert, pendant 8 min.","Retourner la tortilla à l'aide d'une assiette et cuire encore 3 min. Servir avec la salade."]},
{id:"b144",n:"Nasi goreng",c:"Œufs",t:25,i:[["Riz basmati",150,"g","epi"],["Œufs",2,"","cremerie"],["Crevettes décortiquées",100,"g","viande"],["Carottes",1,"","leg"],["Petits pois surgelés",100,"g","surg"],["Sauce soja",3,"c. à s.","epi"],["Oignon",1,"","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min, puis l'étaler pour qu'il refroidisse.","Faire sauter l'oignon, la carotte en dés et les petits pois dans l'huile à puissance 8 pendant 4 min.","Ajouter les crevettes 2 min, puis le riz et la sauce soja, et cuire 4 min.","Cuire les œufs au plat à puissance 5 pendant 3 min et les poser sur le riz."]},
{id:"b145",n:"Croque-madame et salade",c:"Œufs",t:25,i:[["Pain de mie",8,"tranche","pain"],["Jambon blanc",4,"tranche","viande"],["Emmental en tranches",4,"tranche","cremerie"],["Œufs",4,"","cremerie"],["Beurre",20,"g","cremerie"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 200 °C en position gril.","Beurrer le pain, garnir de jambon et de fromage, refermer et enfourner 10 min.","Cuire les œufs au plat à puissance 5 pendant 3 min.","Poser un œuf sur chaque croque et servir avec la salade."]},
{id:"b146",n:"Omelette au fromage et pommes de terre sautées",c:"Œufs",t:25,i:[["Œufs",5,"","cremerie"],["Emmental râpé",60,"g","cremerie"],["Pommes de terre",400,"g","leg"],["Beurre",15,"g","cremerie"],["Salade verte",1,"","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Couper les pommes de terre en dés et les faire sauter dans l'huile à puissance 7 : 10 min à couvert, puis 5 min à découvert.","Battre les œufs avec du sel et du poivre.","Faire fondre le beurre à puissance 5, verser les œufs et cuire 3 min, puis ajouter le fromage.","Plier l'omelette et servir avec les pommes de terre et la salade."]},
{id:"b147",n:"Bibimbap",c:"Œufs",t:35,i:[["Riz rond",150,"g","epi"],["Rumsteck",150,"g","viande"],["Carottes",1,"","leg"],["Courgettes",1,"","leg"],["Jeunes pousses",80,"g","leg"],["Œufs",2,"","cremerie"],["Sauce soja",3,"c. à s.","epi"],["Graines de sésame",1,"c. à s.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire le riz dans 1,5 fois son volume d'eau : puissance 9 puis puissance 2 à couvert pendant 12 min.","Faire sauter séparément la carotte et la courgette en julienne dans un peu d'huile à puissance 7, 3 min chacune.","Saisir le bœuf émincé avec la sauce soja à puissance 9 pendant 2 min.","Cuire les œufs au plat, puis dresser les bols : riz, légumes, pousses, bœuf, œuf et sésame."]},
{id:"b148",n:"Okonomiyaki, galettes de chou japonaises",c:"Œufs",t:30,i:[["Chou blanc",300,"g","leg"],["Farine",100,"g","plac"],["Œufs",3,"","cremerie"],["Lardons",80,"g","viande"],["Oignons nouveaux",2,"","leg"],["Sauce soja",2,"c. à s.","epi"],["Mayonnaise",2,"c. à s.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Émincer finement le chou et les oignons nouveaux.","Mélanger la farine, les œufs et 10 cl d'eau, puis ajouter le chou, les oignons et les lardons.","Cuire deux galettes dans l'huile à puissance 6, à couvert, 5 min de chaque côté.","Servir avec la sauce soja et la mayonnaise."]},
{id:"b149",n:"Clafoutis salé tomates et feta",c:"Œufs",t:45,i:[["Œufs",3,"","cremerie"],["Farine",60,"g","plac"],["Lait",25,"cl","cremerie"],["Tomates cerises",300,"g","leg"],["Feta",100,"g","cremerie"],["Basilic",1,"botte","leg"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 180 °C.","Fouetter les œufs avec la farine puis le lait, saler et poivrer.","Répartir les tomates cerises, la feta en dés et le basilic dans un plat, puis verser la pâte.","Enfourner 35 min et servir avec la salade."]},
{id:"b150",n:"Soufflé au fromage",c:"Œufs",t:50,i:[["Œufs",4,"","cremerie"],["Lait",25,"cl","cremerie"],["Beurre",30,"g","cremerie"],["Farine",30,"g","plac"],["Comté",100,"g","cremerie"],["Muscade",1,"pincée","plac"],["Salade verte",1,"","leg"]],s:["Préchauffer le four à 200 °C et beurrer un moule à soufflé.","Faire fondre le beurre à puissance 4, ajouter la farine 1 min, puis le lait en fouettant jusqu'à épaississement, environ 4 min.","Hors du feu, ajouter les jaunes, le comté râpé et la muscade, puis incorporer délicatement les blancs montés en neige ferme.","Verser dans le moule et enfourner 25 min sans ouvrir le four. Servir aussitôt avec la salade."]},
{id:"x01",n:"Velouté de potimarron et châtaignes",c:"Entrée",t:40,b:4,i:[["Potimarron",1,"","leg"],["Châtaignes cuites",150,"g","epi"],["Oignon",1,"","leg"],["Bouillon de légumes",1,"cube","epi"],["Crème fraîche",15,"cl","cremerie"],["Beurre",15,"g","cremerie"]],s:["Laver le potimarron (inutile de l'éplucher), retirer les graines et le couper en cubes.","Faire revenir l'oignon émincé dans le beurre à puissance 6 pendant 3 min, puis ajouter le potimarron, les châtaignes (en garder quelques-unes), le cube et 1 l d'eau.","Porter à ébullition à puissance 9, puis cuire à puissance 5 pendant 25 min.","Mixer avec la crème et servir parsemé des châtaignes gardées, émiettées."]},
{id:"x02",n:"Œufs mimosa",c:"Entrée",t:25,b:4,i:[["Œufs",6,"","cremerie"],["Mayonnaise",4,"c. à s.","epi"],["Ciboulette",1,"botte","leg"],["Salade verte",1,"","leg"]],s:["Cuire les œufs dans l'eau bouillante à puissance 9 pendant 10 min, puis les refroidir dans l'eau froide et les écaler.","Couper les œufs en deux, retirer les jaunes et les écraser avec la mayonnaise.","Garnir les blancs de ce mélange.","Parsemer de ciboulette ciselée et servir sur quelques feuilles de salade."]},
{id:"x03",n:"Salade de chèvre chaud",c:"Entrée",t:15,b:4,i:[["Fromage de chèvre",200,"g","cremerie"],["Baguette",1,"","pain"],["Salade verte",1,"","leg"],["Noix",40,"g","epi"],["Miel",1,"c. à s.","epi"],["Huile d'olive",3,"c. à s.","plac"],["Vinaigre",1,"c. à s.","plac"]],s:["Préchauffer le four en position gril.","Couper la baguette en 8 tranches, poser une rondelle de chèvre sur chacune et un filet de miel.","Enfourner 5 min.","Servir sur la salade assaisonnée d'huile et de vinaigre, parsemée de noix."]},
{id:"x04",n:"Saumon fumé, blinis et crème citronnée",c:"Entrée",t:15,b:4,i:[["Saumon fumé",200,"g","viande"],["Blinis",12,"","epi"],["Crème fraîche",15,"cl","cremerie"],["Citron",1,"","leg"],["Aneth",1,"botte","leg"]],s:["Fouetter la crème avec le zeste et le jus d'un demi-citron, du sel et du poivre.","Réchauffer les blinis à sec dans une poêle à puissance 5, 1 min de chaque côté.","Garnir chaque blini de crème et d'un morceau de saumon.","Décorer d'aneth et servir aussitôt."]},
{id:"x05",n:"Verrines avocat, crevettes et pamplemousse",c:"Entrée",t:15,b:4,i:[["Avocat",2,"","leg"],["Crevettes décortiquées",200,"g","viande"],["Citron vert",1,"","leg"],["Pamplemousse",1,"","leg"],["Fromage blanc",100,"g","cremerie"],["Coriandre",1,"botte","leg"]],s:["Écraser les avocats avec le jus du citron vert, du sel et du poivre.","Mélanger le fromage blanc avec la coriandre ciselée. Peler le pamplemousse à vif et le couper en dés.","Dans des verrines, superposer l'avocat, le fromage blanc et les crevettes.","Décorer de pamplemousse et garder au frais jusqu'au service."]},
{id:"x06",n:"Velouté de champignons",c:"Entrée",t:30,b:4,i:[["Champignons de Paris",500,"g","leg"],["Échalote",2,"","leg"],["Bouillon de volaille",1,"cube","epi"],["Crème fraîche",15,"cl","cremerie"],["Beurre",20,"g","cremerie"],["Persil",1,"botte","leg"]],s:["Faire fondre les échalotes émincées dans le beurre à puissance 5 pendant 3 min.","Ajouter les champignons émincés et cuire 8 min à puissance 6.","Ajouter le cube et 70 cl d'eau, puis cuire à puissance 5 pendant 15 min.","Mixer avec la crème et parsemer de persil."]},
{id:"a01",n:"Houmous maison et bâtonnets de légumes",c:"Apéro",t:15,b:4,i:[["Pois chiches en boîte",400,"g","epi"],["Tahini",2,"c. à s.","epi"],["Citron",1,"","leg"],["Ail",1,"gousse","leg"],["Carottes",3,"","leg"],["Céleri",2,"branche","leg"],["Paprika",1,"c. à c.","epi"],["Huile d'olive",4,"c. à s.","plac"]],s:["Égoutter les pois chiches en gardant un peu de leur jus.","Les mixer avec le tahini, le jus du citron, l'ail, 3 c. à s. d'huile et 3 c. à s. de jus jusqu'à obtenir une crème lisse.","Couper les carottes et le céleri en bâtonnets.","Servir le houmous arrosé du reste d'huile et saupoudré de paprika."]},
{id:"a02",n:"Gougères au comté",c:"Apéro",t:45,b:4,i:[["Farine",75,"g","plac"],["Beurre",50,"g","cremerie"],["Œufs",2,"","cremerie"],["Comté",80,"g","cremerie"],["Lait",12,"cl","cremerie"]],s:["Préchauffer le four à 200 °C.","Porter à ébullition le lait, 5 cl d'eau, le beurre et une pincée de sel à puissance 7. Hors du feu, ajouter la farine d'un coup et mélanger.","Remettre à puissance 4 et dessécher la pâte 1 min en remuant. Hors du feu, incorporer les œufs un à un, puis le comté râpé.","Former des petites boules sur une plaque et enfourner 20 min."]},

{id:"a05",n:"Cake salé olives et jambon",c:"Apéro",t:55,b:4,i:[["Farine",150,"g","plac"],["Levure chimique",1,"sachet","epi"],["Œufs",3,"","cremerie"],["Lait",10,"cl","cremerie"],["Huile d'olive",6,"c. à s.","plac"],["Jambon blanc",3,"tranche","viande"],["Olives vertes",100,"g","epi"],["Emmental râpé",80,"g","cremerie"]],s:["Préchauffer le four à 180 °C.","Mélanger la farine et la levure, puis ajouter les œufs, le lait et l'huile.","Incorporer le jambon en dés, les olives et le fromage.","Verser dans un moule à cake et enfourner 40 min. Laisser tiédir avant de couper en cubes."]},
{id:"d01",n:"Mousse au chocolat",c:"Dessert",t:20,b:4,i:[["Chocolat noir",200,"g","epi"],["Œufs",6,"","cremerie"],["Sucre",1,"c. à s.","plac"]],s:["Faire fondre le chocolat au bain-marie à puissance 3, puis le laisser tiédir.","Séparer les blancs des jaunes et incorporer les jaunes au chocolat.","Monter les blancs en neige ferme avec le sucre.","Incorporer délicatement les blancs au chocolat en trois fois, puis réserver au frais au moins 3 h."]},

{id:"d06",n:"Panna cotta et coulis de fruits rouges",c:"Dessert",t:20,b:4,i:[["Crème liquide",50,"cl","cremerie"],["Sucre",60,"g","plac"],["Gélatine",3,"feuille","epi"],["Vanille",1,"gousse","epi"],["Fruits rouges surgelés",250,"g","surg"]],s:["Faire ramollir la gélatine 5 min dans l'eau froide.","Chauffer la crème avec le sucre et la vanille fendue à puissance 4 pendant 5 min sans faire bouillir, puis ajouter la gélatine essorée.","Verser dans des verrines et réserver au frais 4 h.","Faire compoter les fruits rouges à puissance 4 pendant 8 min avec 1 c. à s. de sucre, mixer et servir sur les panna cotta."]},

const COURSE_CATS=['Entrée','Dessert','Apéro'];
const isMain=r=>!COURSE_CATS.includes(r.c)&&!r.f;
const curMonth=()=>new Date().getMonth()+1;
function seasonKey(name){ const n=norm(name); if(/pommes? de terre/.test(n)||n.includes('citron vert')) return null; return VEG.find(v=>n.includes(v[1]))||null; }
function seasonOf(r,m=curMonth()){ const inS=[],out=[]; r.i.forEach(([n,,,ray])=>{ if(ray!=='leg') return; const v=seasonKey(n); if(!v) return; (v[2].includes(m)?inS:out).push(n); }); return {inS,out,st:out.length?'hors':inS.length?'saison':'neutre'}; }
function seasonTag(r){ const s=seasonOf(r).st; return s==='saison'?'<span class="tag-season">De saison</span>':s==='hors'?'<span class="tag-off">Hors saison</span>':''; }
function seasonBlock(r){
  const s=seasonOf(r), mo=MONTHS[curMonth()-1], low=a=>esc(a.map(x=>x.toLowerCase()).join(', ')); let h='';
  if(s.inS.length) h+=`<p class="season ok">${ico('leaf',18)}<span>De saison en ${mo} : ${low(s.inS)}.</span></p>`;
  if(s.out.length) h+=`<p class="season off">${ico('leaf',18)}<span>Pas de saison en ${mo} : ${low(s.out)}. On en trouve, mais ces produits viennent de loin et ont moins de goût. Garde ce plat pour plus tard, ou remplace-les par un produit de saison.</span></p>`;
  return h;
}

function migrateOld(s){

/* Semaines */
function mondayOf(d){ const x=new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate()-((x.getDay()+6)%7)); return x; }
const keyOf=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
let curWeek=mondayOf(new Date());
function plan(k=keyOf(curWeek)){ if(!S.plans[k]) S.plans[k]={days:{},checked:[],extras:[]}; const p=S.plans[k]; p.checked=p.checked||[]; p.extras=p.extras||[];
  for(const d in p.days){ if(!R(p.days[d].id)) delete p.days[d]; } p.extras.forEach(x=>{ if(!x.ray) x.ray=guessRayon(x.t); }); return p; }
function dateOfDay(i){ const d=new Date(curWeek); d.setDate(d.getDate()+i); return d; }
function weekLabel(){
  const m=curWeek, e=dateOfDay(6);
  const diff=Math.round((m-mondayOf(new Date()))/(7*864e5));
  const rel=diff===0?'Cette semaine':diff===1?'Semaine prochaine':diff===-1?'Semaine dernière':(diff>0?`Dans ${diff} semaines`:`Il y a ${-diff} semaines`);
  const range=m.getMonth()===e.getMonth()?`du ${m.getDate()} au ${e.getDate()} ${MONTHS[e.getMonth()]}`:`du ${m.getDate()} ${MONTHS[m.getMonth()]} au ${e.getDate()} ${MONTHS[e.getMonth()]}`;
  return {rel,range};
}
function todayIndex(){ return keyOf(curWeek)===keyOf(mondayOf(new Date())) ? (new Date().getDay()+6)%7 : -1; }

/* Quantités */
function fmtQty(q,u,f=1){
  if(q==null) return '';
  const v=q*f;
  if(CONV[u]) return fmtBase(CONV[u][0],v*CONV[u][1]);
  if(u==='c. à s.'||u==='c. à c.') return `${fr(Math.max(.5,Math.round(v*2)/2))} ${u}`;
  const n=Math.max(1,Math.ceil(v-1e-9));
  if(!u) return fr(n);
  return `${fr(n)} ${n>1&&PLURAL[u]?PLURAL[u]:u}`;
}
function fmtBase(fam,x){
  if(fam==='g'){ if(x>=1000) return `${fr(Math.round(x/10)/100)} kg`; return `${fr(x>=100?Math.round(x/5)*5:Math.round(x))} g`; }
  if(x>=1000) return `${fr(Math.round(x/10)/100)} l`;
  if(x>=10) return `${fr(Math.round(x/5)/2)} cl`;
  return `${fr(Math.round(x))} ml`;
}
const famOf=u=>CONV[u]?CONV[u][0]:(u||'');
const itemKey=(n,u)=>norm(n)+'|'+famOf(u);

/* Analyse d'une ligne d'ingrédient saisie à la main */
const UNIT_MAP=[[/^kg$/i,'kg'],[/^g$|^gr$|^grammes?$/i,'g'],[/^ml$/i,'ml'],[/^cl$/i,'cl'],[/^dl$/i,'dl'],[/^l$|^litres?$/i,'l'],
 [/^(c\. ?à ?s\.?|cs|cuill(è|e)res? à soupe)$/i,'c. à s.'],[/^(c\. ?à ?c\.?|cc|cuill(è|e)res? à café)$/i,'c. à c.'],
 [/^gousses?$/i,'gousse'],[/^tranches?$/i,'tranche'],[/^boules?$/i,'boule'],[/^bottes?$/i,'botte'],[/^cubes?$/i,'cube'],[/^rouleaux?$/i,'rouleau'],[/^branches?$/i,'branche'],[/^pincées?$/i,'pincée'],[/^feuilles?$/i,'feuille'],[/^sachets?$/i,'sachet']];
function parseLine(line){
  const m=line.match(/^\s*(\d+(?:[.,]\d+)?)\s*(kg|g|gr|grammes?|ml|cl|dl|l|litres?|c\. ?à ?s\.?|c\. ?à ?c\.?|cs|cc|cuill(?:è|e)res? à soupe|cuill(?:è|e)res? à café|gousses?|tranches?|boules?|bottes?|cubes?|rouleaux?|branches?|pincées?|feuilles?|sachets?)?(?=\s|$)\s*(?:de |d'|d’)?(.*)$/i);
  if(!m) return {q:null,u:'',name:line.trim()};
  let u=''; if(m[2]){ const f=UNIT_MAP.find(([re])=>re.test(m[2])); u=f?f[1]:''; }
  const name=(m[3]||'').trim();
  return {q:parseFloat(m[1].replace(',','.')),u,name:name?name.charAt(0).toUpperCase()+name.slice(1):''};
}
function guessRayon(name){
  const n=norm(name), has=a=>a.some(w=>n.includes(w));
  if(has(['lessive','vaisselle','eponge','poubelle','essuie','nettoyant','papier toilette','javel','adoucissant','serpillere','sopalin'])) return 'menage';
  if(has(['dentifrice','gel douche','shampoing','deodorant','mouchoir','coton','rasoir','savon','brosse a dents','creme hydratante','protection'])) return 'hygiene';
  if(/\b(eau|jus|biere|soda|sirop|limonade)\b/.test(n)||/^vin\b/.test(n)) return 'boisson';
  if(has(['surgele'])) return 'surg';
  if(has(['huile','sel ','poivre','vinaigre','farine','sucre','muscade'])||n==='sel') return 'plac';
  if(has(['coco','conserve','boite','coulis','sauce','bouillon','pates','spaghetti','tagliatelle','penne','riz','lentille','pois chiche','haricots rouges','haricots blancs','semoule','quinoa','nouilles','epice','curry','cumin','paprika','moutarde','tortilla','olive'])) return 'epi';
  if(has(['lait','creme','beurre','fromage','yaourt','oeuf','mozzarella','parmesan','emmental','comte','gruyere','reblochon','feta','ricotta','chevre','cheddar','pate brisee','pate feuilletee','pate a pizza','gnocchi'])) return 'cremerie';
  if(has(['poulet','boeuf','porc','veau','agneau','dinde','canard','jambon','lardon','saucisse','merguez','chorizo','steak','viande','saumon','cabillaud','colin','thon','crevette','moule','poisson','hache'])) return 'viande';
  if(has(['tomate','oignon','ail','carotte','courgette','poivron','salade','champignon','pomme','patate','citron','avocat','epinard','poireau','brocoli','chou','celeri','persil','basilic','coriandre','ciboulette','aneth','echalote','gingembre','navet','endive','potiron','courge','butternut','banane','fruit','legume','haricots verts','concombre','radis','herbe','menthe','thym'])) return 'leg';
  if(has(['pain','baguette','brioche'])) return 'pain';
  return 'epi';
}

/* Durées pour le minuteur */
function detectDuration(text){
  const t=text.toLowerCase(); let m, s=0;
  if((m=t.match(/(\d+)\s*(?:h|heures?)(?![a-zà-ÿ])\s*(\d{1,2})?/))) s+= +m[1]*3600 + (m[2]? +m[2]*60:0);
  if((m=t.match(/(\d+)\s*min(?:utes?)?\b/))) s+= +m[1]*60;
  if(!s && (m=t.match(/(\d+)\s*s(?:ec(?:ondes?)?)?\b/))) s= +m[1];
  return s;
}
const mmss=s=>{ const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`; };
const durLabel=s=>{ const h=Math.floor(s/3600), m=Math.floor(s%3600/60); if(h) return m?`${h} h ${m}`:`${h} h`; if(m) return `${m} min`; return `${s} s`; };

/* =========================================================
   Courses
   ========================================================= */
function buildList(p=plan()){
  const map=new Map();
  Object.keys(p.days).sort().forEach(d=>{ const e=p.days[d]; entryIds(e).forEach(rid=>{ const r=R(rid); const f=e.p/(r.b||2);
    r.i.forEach(([n,q,u,ray])=>{ const k=itemKey(n,u); let it=map.get(k);
      if(!it){ it={key:k,name:n,ray:ray||'epi',u:u||'',fam:famOf(u),total:0,hasQ:false,dishes:[]}; map.set(k,it); }
      if(q!=null){ it.total+= CONV[u]? q*f*CONV[u][1] : q*f; it.hasQ=true; }
      if(!it.dishes.includes(r.n)) it.dishes.push(r.n);
    }); }); });
  return [...map.values()];
}
function itemQty(it){
  if(!it.hasQ) return '';
  if(it.fam==='g'||it.fam==='ml') return fmtBase(it.fam,it.total);
  return fmtQty(it.total,it.u,1);
}
function missingFor(e,p){
  const ch=new Set(p.checked);
  const keys=[...new Set(entryIds(e).flatMap(id=>R(id).i).filter(x=>x[3]!=='plac').map(([n,,u])=>itemKey(n,u)))];
  return keys.filter(k=>!ch.has(k)).length;
}
function statusHtml(e,p){
  if(e.done) return `<span class="st-done">Cuisiné</span>`;
  const n=missingFor(e,p);
  return n===0?`<span class="st-ready">Tout est acheté</span>`:`<span class="st-todo">${n} article${n>1?'s':''} à acheter</span>`;
}

/* =========================================================
   Propositions de dîners
   ========================================================= */
function suggest(d,exclude=[]){
  const p=plan(), used=new Set(Object.values(p.days).map(e=>e.id)); exclude.forEach(x=>x&&used.add(x));
  const cats={}; Object.entries(p.days).forEach(([i,e])=>{ if(+i!==d){ const r=R(e.id); if(r) cats[r.c]=(cats[r.c]||0)+1; } });
  const pool=ALL().filter(r=>!used.has(r.id)&&isMain(r)); if(!pool.length) return null;
  const now=Date.now();
  const w=pool.map(r=>{ let x=1;
    if(isFav(r.id)) x*=3; if(r.own) x*=1.5;
    const ss=seasonOf(r).st; if(ss==='saison') x*=2.2; else if(ss==='hors') x*=.2;
    const c=S.cooked[r.id]; if(c && (now-new Date(c))/864e5<14) x*=.25;
    const n=cats[r.c]||0; x*= n>=2?.12:n===1?.55:1;
    if(r.t>50) x*= d>=5?1.6:.1;
    return x; });
  let t=w.reduce((a,b)=>a+b,0)*Math.random();
  for(let i=0;i<pool.length;i++){ t-=w[i]; if(t<=0) return pool[i].id; }
  return pool[pool.length-1].id;
}
/* Jours déjà passés de la semaine affichée : on ne les remplit pas automatiquement */
function isPast(i){ const w=keyOf(curWeek), now=keyOf(mondayOf(new Date())); if(w<now) return true; if(w>now) return false; return i<(new Date().getDay()+6)%7; }
function fillableDays(){ const p=plan(); return [...S.settings.days].sort().filter(d=>!p.days[d]&&!isPast(d)); }
function fillWeek(){
  const p=plan(); let n=0;
  fillableDays().forEach(d=>{ const id=suggest(d); if(id){ p.days[d]={id,p:S.settings.portions}; n++; } });
  return n;
}

/* Accueil */
function seededPick(list,n,seed){
  let x=0; for(const ch of seed) x=(x*31+ch.charCodeAt(0))>>>0;
  const a=[...list]; for(let i=a.length-1;i>0;i--){ x=(x*1103515245+12345)>>>0; const j=x%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a.slice(0,n);
}

      <div class="acts"><button class="btn btn-mustard" data-a="day-suggest" data-d="${ti}">${ico('shuffle',20)}Me proposer un plat</button><button class="btn btn-ghost-light" data-a="day-choose" data-d="${ti}">Choisir</button></div></section>`;

  h+=`</div><div class="h-recv">`;
  // Recevoir
  h+=`<div class="sec-head"><h2>Tu reçois ?</h2><button class="link" data-a="rf-go" data-f="recevoir">Recettes</button></div>
    <div class="ideas">${MENUS.map(mn=>`<button class="idea menu-card" data-a="menu-open" data-m="${mn.id}" style="--cat:#C9A44A"><span class="ph" aria-hidden="true">${mn.e}</span><span class="tx"><span class="nm">${esc(mn.n)}</span><span class="mt">${esc(mn.d)}</span></span></button>`).join('')}</div>`;

  h+=`</div><div class="h-quick">`;

  h+=`</div><div class="h-favs">`;
  // Coups de cœur
  const favs=S.favs.map(R).filter(Boolean);
  h+=`<div class="sec-head"><h2>Tes coups de cœur</h2>${favs.length?`<button class="link" data-a="rf-go" data-f="fav">Tout voir</button>`:''}</div>`;

  h+=`</div></div>`;
  return h;
}

function dayMain(e,i,p){

}

function viewShop(){
  const p=plan(), list=buildList(p), ch=new Set(p.checked);
  let h=`<header class="top"><h1>Courses</h1></header>${weekNav()}`;
  if(!list.length && !p.extras.length){
    return h+`<section class="empty"><h2>Ta liste est vide</h2><p>Elle se remplit toute seule dès que tu prévois des dîners pour la semaine.</p><button class="btn btn-primary" data-a="tab" data-tab="semaine">${ico('week',20)}Planifier ma semaine</button><button class="btn btn-secondary add-daily" data-a="daily-open">${ico('plus',20)}Produits du quotidien</button></section>`;
  }
  const main=list.filter(it=>it.ray!=='plac'), plac=list.filter(it=>it.ray==='plac');
  const total=main.length+p.extras.length, done=main.filter(it=>ch.has(it.key)).length+p.extras.filter(x=>x.done).length;
  h+=`<div class="summary"><b>${done===total&&total?'Tout est dans le panier':`${total-done} article${total-done>1?'s':''} à prendre`}</b><span>${done} sur ${total}</span></div>
    <div class="progress"><i style="width:${total?Math.round(done/total*100):0}%"></i></div>
    <button class="btn btn-secondary btn-block add-daily" data-a="daily-open">${ico('plus',20)}Ajouter des produits du quotidien</button>`;
  const entries=Object.keys(p.days).sort().map(d=>[+d,p.days[d]]);
  if(entries.length) h+=`<div class="dishes">${entries.map(([d,e])=>{ const r=R(e.id), n=missingFor(e,p);
      return `<button class="dish ${n===0?'ready':''}" ${e.label?`data-a="day-menu" data-d="${d}"`:`data-a="open-recipe" data-id="${r.id}" data-d="${d}"`}><span><span class="nm">${esc(e.label||r.n)}</span><small>${DSHORT[d]}. ${n===0?'Tout est acheté':`${n} à acheter`}</small></span></button>`; }).join('')}</div>`;
  h+=`<div class="shop-cols">`;
  RAYON_ORDER.forEach(ray=>{
    const items=main.filter(it=>it.ray===ray), xs=p.extras.map((x,i)=>[x,i]).filter(([x])=>x.ray===ray);
    if(!items.length&&!xs.length) return;
    items.sort((a,b)=>(ch.has(a.key)-ch.has(b.key))||a.name.localeCompare(b.name,'fr'));
    xs.sort((a,b)=>(a[0].done-b[0].done)||a[0].t.localeCompare(b[0].t,'fr'));
    h+=`<section class="aisle"><h3>${RAYONS[ray]}</h3><div class="items">${items.map(it=>itemRow(it,ch)).join('')}${xs.map(([x,i])=>extraRow(x,i)).join('')}</div></section>`;
  });
  h+=`</div>`;
  if(plac.length){
    h+=`<details class="plac"><summary>À vérifier dans tes placards <span>${plac.length} article${plac.length>1?'s':''}</span></summary><div class="items">${plac.sort((a,b)=>a.name.localeCompare(b.name,'fr')).map(it=>itemRow(it,ch)).join('')}</div></details>`;
  }
  h+=`<div class="list-acts"><button class="btn btn-secondary" data-a="copy-list">Copier la liste</button><button class="btn btn-secondary" data-a="uncheck-all">Tout décocher</button></div>`;
  return h;
}
function extraRow(x,i){
  const st=S.staples.some(s=>norm(s.t)===norm(x.t));

}
function itemRow(it,ch){
  const on=ch.has(it.key);
  return `<div class="item ${on?'on':''}" data-a="toggle-item" data-key="${esc(it.key)}" role="checkbox" aria-checked="${on}" tabindex="0"><span class="box">${ico('check',16)}</span><span><span class="iname">${esc(it.name)}</span><span class="ifor">${esc(it.dishes.join(', '))}${(()=>{ const v=it.ray==='leg'&&seasonKey(it.name); return v&&!v[2].includes(curMonth())?', <em class="tag-off">hors saison</em>':''; })()}</span></span><span class="iqty">${esc(itemQty(it))}</span></div>`;
}

function viewRecipes(){
  const nf=S.favs.filter(id=>R(id)).length, nm=S.custom.length;
  const chips=[['all','Toutes'],['season','De saison'],['fav',`Coups de cœur${nf?` (${nf})`:''}`],['mine',`Mes recettes${nm?` (${nm})`:''}`],['recevoir','Pour recevoir'],...Object.keys(CATS).filter(c=>ALL().some(r=>r.c===c)).map(c=>['c:'+c,c])];
  return `<header class="top"><h1>Recettes</h1><button class="btn btn-primary btn-sm" data-a="new-recipe">${ico('plus',18)}Ajouter</button></header>
    <div class="search">${ico('search',20)}<input id="rq" type="search" placeholder="Chercher un plat ou un ingrédient" value="${esc(rQuery)}" aria-label="Chercher une recette"></div>
    <div class="filters">${chips.map(([f,l])=>`<button class="chip ${rFilter===f?'on':''}" data-a="rf" data-f="${esc(f)}">${esc(l)}</button>`).join('')}</div>
    <div class="filters time-filters">${timeChips(rTime,'rt')}</div>
    <div id="rlist">${recipeList()}</div>`;
}
function filteredRecipes(){
  const q=norm(rQuery);
  return ALL().filter(r=>{
    if(rFilter==='fav'&&!isFav(r.id)) return false;
    if(rFilter==='mine'&&!r.own) return false;
    if(!timeOk(r,rTime)) return false;
    if(rFilter==='season'&&seasonOf(r).st!=='saison') return false;
    if(rFilter==='recevoir'&&!(r.f||COURSE_CATS.includes(r.c))) return false;
    if(rFilter.startsWith('c:')&&r.c!==rFilter.slice(2)) return false;
    if(q && !norm(r.n).includes(q) && !r.i.some(x=>norm(x[0]).includes(q))) return false;
    return true;
  }).sort((a,b)=>(isFav(b.id)-isFav(a.id))||a.n.localeCompare(b.n,'fr'));
}
function recipeList(){
  const list=filteredRecipes();
  if(!list.length){
    const msg=rTime!=='all'&&rFilter==='all'&&!rQuery?"Aucune recette dans cette durée.":rFilter==='season'?"Aucune recette entièrement de saison ne correspond.":rFilter==='fav'?"Pas encore de coup de cœur. Touche le cœur d'une recette pour la garder ici.":rFilter==='mine'?"Tu n'as pas encore ajouté de recette. Utilise le bouton Ajouter.":"Aucune recette ne correspond à ta recherche.";
    return `<div class="rlist"><p class="noresult">${msg}</p></div>`;
  }
  return `<p class="count-line">${list.length} recette${list.length>1?'s':''}</p><div class="rlist">${list.map(rRow).join('')}</div>`;
}
function rRow(r){
  const [e,col]=CATS[r.c]||CATS.Autre;
  return `<div class="rrow" data-a="open-recipe" data-id="${r.id}"><div class="tile" style="--cat:${col}" aria-hidden="true">${e}</div>
    <div><div class="rname">${esc(r.n)}</div><div class="rmeta"><span>${r.t} min</span><span>${esc(r.c)}</span>${r.own?'<span>Ma recette</span>':''}${seasonTag(r)}</div></div>
    <button class="heart ${isFav(r.id)?'on':''}" data-a="fav" data-id="${r.id}" aria-pressed="${isFav(r.id)}" aria-label="${isFav(r.id)?'Retirer des':'Ajouter aux'} coups de cœur">${ico('heart')}</button></div>`;
}

  let h=`<h2 class="sheet-h">Produits du quotidien</h2><p class="sheet-sub">Touche un produit pour l'ajouter à ta liste, il sera rangé au bon rayon.</p>

  if(S.staples.length) h+=`<div class="sec-head sm"><h3>Mes indispensables</h3><button class="link" data-a="staples-all">Tout ajouter</button></div><div class="qchips">${S.staples.map(s=>chip(s.t,s.ray)).join('')}</div>`;
  else h+=`<p class="hint" style="margin-top:14px">Astuce : touche l'étoile d'un produit dans ta liste pour en faire un indispensable, à remettre en un geste chaque semaine.</p>`;

function coursePool(type){

  const w=pool.map(r=>{ let x=1; if(isFav(r.id)) x*=3; const s=seasonOf(r).st; if(s==='saison') x*=2.5; else if(s==='hors') x*=.15; if(type==='Plat'&&r.f) x*=4; return x; });

}

/* =========================================================
   Mode cuisine
   ========================================================= */
let cook=null, timer=null, timerInt=null, wakeLock=null;
function openCook(id,d){
  const r=R(id); if(!r) return;
  const p=d!=null&&plan().days[d]?plan().days[d].p:(sheetType==='recipe'&&ctx.id===id?detP:S.settings.portions);
  cook={id,d,wk:keyOf(curWeek),step:0,p,marked:false};
  closeSheet(); $('#cook').classList.add('show'); document.body.classList.add('locked');
  renderCook(); reqWake();
}
function renderCook(){
  const r=R(cook.id), n=r.s.length, st=cook.step;
  let body;
  if(st<n){
    const sec=detectDuration(r.s[st]);
    body=`<div class="cook-body"><div class="cook-label">Étape ${st+1} sur ${n}</div><p class="cook-text">${esc(r.s[st])}</p>
      ${sec?(timer&&timer.step===st&&!timer.fired?`<button class="btn btn-ghost-light cook-timer-btn" data-a="timer-stop">Arrêter le minuteur</button>`:`<button class="btn btn-mustard cook-timer-btn" data-a="timer-start" data-s="${sec}" data-l="étape ${st+1}">${ico('pot',20)}Lancer un minuteur de ${durLabel(sec)}</button>`):''}</div>
      <div class="cook-nav"><button class="btn btn-ghost-light" data-a="cook-prev" ${st===0?'disabled':''}>Précédent</button><button class="btn btn-mustard" data-a="cook-next">${st===n-1?'Terminer':'Suivant'}</button></div>`;
  } else {
    if(!cook.marked){ S.cooked[cook.id]=keyOf(new Date()); if(cook.d!=null){ const e=S.plans[cook.wk]?.days[cook.d]; if(e&&e.id===cook.id) e.done=true; } cook.marked=true; save(); }
    const f=isFav(cook.id);
    body=`<div class="cook-body cook-end"><div class="cook-label">C'est prêt</div><p class="cook-text">Bon appétit !</p><p>Le plat est marqué comme cuisiné. Tu as aimé ? Ajoute-le à tes coups de cœur pour qu'il revienne plus souvent.</p>
      <button class="btn ${f?'btn-ghost-light':'btn-mustard'} heart-big ${f?'on':''}" data-a="fav" data-id="${cook.id}" aria-pressed="${f}">${ico('heart',20)}${f?'Dans tes coups de cœur':'Ajouter aux coups de cœur'}</button></div>
      <div class="cook-nav"><button class="btn btn-ghost-light" data-a="cook-prev">Revoir les étapes</button><button class="btn btn-mustard" data-a="cook-close">Fermer</button></div>`;
  }
  $('#cook').innerHTML=`<div class="cook-top"><button class="icon-btn" data-a="cook-close" aria-label="Quitter le mode cuisine">${ico('close',20)}</button><div class="cook-title">${esc(r.n)}</div>
    <button class="ctimer" id="ctimer" data-a="timer-stop" hidden></button><button class="cook-chip" data-a="cook-ings">Ingrédients</button></div>
    <div class="segs">${r.s.map((_,i)=>`<i class="${i<=st?'on':''}"></i>`).join('')}</div>${body}`;
  tickTimer();
}
function closeCook(){ $('#cook').classList.remove('show'); timer=null; if(!$('#sheet').classList.contains('show')) document.body.classList.remove('locked'); relWake(); render(); }
function startTimer(sec,label){ timer={end:Date.now()+sec*1000,label,fired:false,step:cook.step}; if(!timerInt) timerInt=setInterval(tickTimer,500); renderCook(); toast(`Minuteur lancé : ${durLabel(sec)}`); }
function tickTimer(){
  const el=$('#ctimer'); if(!el) return;
  if(!timer){ el.hidden=true; el.classList.remove('ring'); return; }
  const rem=Math.max(0,Math.ceil((timer.end-Date.now())/1000));
  el.hidden=false; el.textContent=rem>0?mmss(rem):'Terminé'; el.classList.toggle('ring',rem===0);
  el.setAttribute('aria-label',rem>0?`Minuteur ${mmss(rem)}, toucher pour arrêter`:'Minuteur terminé, toucher pour fermer');
  if(rem===0&&!timer.fired){ timer.fired=true; beep(); toast(`Minuteur terminé (${timer.label})`); }
}
function beep(){
  try{ const ctx=new (window.AudioContext||window.webkitAudioContext)();
    [0,.3,.6,.9].forEach(t=>{ const o=ctx.createOscillator(), g=ctx.createGain(); o.connect(g); g.connect(ctx.destination); o.frequency.value=880;
      g.gain.setValueAtTime(.001,ctx.currentTime+t); g.gain.exponentialRampToValueAtTime(.35,ctx.currentTime+t+.02); g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.22);
      o.start(ctx.currentTime+t); o.stop(ctx.currentTime+t+.25); }); }catch(e){}
  if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]);
}
async function reqWake(){ try{ if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen'); }catch(e){} }
function relWake(){ try{ wakeLock&&wakeLock.release(); }catch(e){} wakeLock=null; }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&$('#cook').classList.contains('show')) reqWake(); });

function readyDays(p){ return Object.keys(p.days).filter(d=>!p.days[d].done&&missingFor(p.days[d],p)===0); }
function toggleItem(key){
  const p=plan(), before=new Set(readyDays(p)), s=new Set(p.checked);
  s.has(key)?s.delete(key):s.add(key); p.checked=[...s]; save();
  const fresh=readyDays(p).filter(d=>!before.has(d));
  const main=buildList(p).filter(it=>it.ray!=='plac'), allDone=main.length&&main.every(it=>s.has(it.key))&&p.extras.every(x=>x.done);
  if(allDone) toast('Courses terminées : tout est dans le panier.');
  else if(fresh.length) toast(`C'est bon pour « ${R(p.days[fresh[0]].id).n} » : tout est acheté.`);
  render();
}
