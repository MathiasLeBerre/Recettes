x5BAAA8UvhARAAAAgAAAQAAAIAAAEAgAAAQAAAIAAAEAAACAAABAAAAgAAAQCAAABAAAAgAAAQAAAIAAABAIAAAEAAACAAABAAAAgAAAQAAAIAAAEAgAAAQAAAIAAAEAAACAAABAAAAgAAAQCAAABAAAAgAAAQAAAIAAAEAIAAAEAAACAAABAAAAgAAAQAAAIAAAEAgAAAQAAAIAAAEAAACAAABAAAAgAAAQCAAABAAAAgAAAQAAAIAAAEAAACAEAA+AgABAAAAgAAAQCAAABAAAAgAAAQAAAIAAAEAAACAAABAIAAAEAAACAAABAAAAgAAAQAAAIAgHN9AsvEkRo5o+WZAAAAAElFTkSuQmCC">

<style>
:root{
  --bg:#EDF0E7; --surface:#FFFFFF; --surface-2:#F5F7F1; --ink:#16251E; --ink-2:#56665D; --line:#D8DED3;
  --forest:#1F4A37; --on-forest:#EEF4EF; --brand-ink:#1F4A37;
  --mustard:#F0B429; --on-mustard:#1E1A08; --tomato:#CF4527; --ok:#2B7A4B;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Figtree',system-ui,sans-serif;
  --r-lg:22px; --r-md:16px;
  color-scheme:light;
}
html[data-theme=dark]{
  --bg:#0F1713; --surface:#16211B; --surface-2:#1C2922; --ink:#E8EFEA; --ink-2:#9BAAA2; --line:#2A3A31;
  --forest:#21503C; --on-forest:#EEF4EF; --brand-ink:#8FD1AE;
  --mustard:#F2BE3D; --tomato:#EE6A4C; --ok:#5DBF85;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;border-radius:8px}
svg{display:block;flex-shrink:0}

.app{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(104px + env(safe-area-inset-bottom))}

/* En-têtes */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.top h1{font-family:var(--display);font-weight:800;font-size:36px;letter-spacing:-.025em;line-height:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex-shrink:0}
.icon-btn:hover{border-color:var(--ink-2)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:20px}
.weeknav .wl{text-align:center;line-height:1.2}
.weeknav .wl b{display:block;font-weight:700;font-size:15px}
.weeknav .wl span{font-size:13px;color:var(--ink-2)}
.nav-btn{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
.nav-btn:hover{background:var(--line)}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:15px;border-radius:999px;padding:12px 18px;border:1px solid transparent;text-decoration:none;line-height:1.2}
.btn-primary{background:var(--forest);color:var(--on-forest)}
.btn-primary:hover{filter:brightness(1.12)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-secondary:hover{border-color:var(--ink-2)}
.btn-mustard{background:var(--mustard);color:var(--on-mustard)}
.btn-mustard:hover{filter:brightness(1.06)}
.btn-ghost-light{background:transparent;color:var(--on-forest);border-color:rgba(255,255,255,.32)}
.btn-ghost-light:hover{background:rgba(255,255,255,.08)}
.btn-ghost-light:disabled{opacity:.35;cursor:default}
.btn-block{width:100%}
.btn-sm{padding:8px 14px;font-size:14px}
.mt{margin-top:14px}
.chip{font-weight:600;font-size:14px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.hint{display:block;font-size:13px;color:var(--ink-2);margin-top:6px;line-height:1.4}

/* Ce soir */
.tonight{position:relative;overflow:hidden;background:var(--forest);color:var(--on-forest);border-radius:var(--r-lg);padding:20px 20px 20px;margin-bottom:20px}
.tonight::after{content:"";position:absolute;right:-58px;top:-58px;width:140px;height:140px;border-radius:50%;border:18px solid var(--mustard);pointer-events:none}
.tonight .when{position:relative;color:var(--mustard);font-weight:700;font-size:15px}
.tonight h2{position:relative;font-family:var(--display);font-weight:800;font-size:clamp(28px,7.5vw,40px);line-height:1.02;letter-spacing:-.025em;margin:8px 0 10px;padding-right:88px;cursor:pointer}
.tonight .meta{position:relative;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;opacity:.85;margin-bottom:16px}
.tonight .acts{position:relative;display:flex;gap:10px;flex-wrap:wrap}

/* Accueil */
.home-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:22px}
.home-date{color:var(--ink-2);font-weight:600;font-size:15px;margin-bottom:4px}
.home-hi{font-family:var(--display);font-weight:800;font-size:clamp(36px,10vw,46px);letter-spacing:-.03em;line-height:.98}
.home-lead{color:var(--ink-2);font-size:17px;margin-top:10px;max-width:34ch}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-head h2{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.015em}
.link{border:0;background:none;color:var(--brand-ink);font-weight:700;font-size:15px;padding:4px 0}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 8px}
.wday{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:6px 0;border-radius:14px;min-width:0}
.wday:not(:disabled):hover{background:var(--surface-2)}
.wday:disabled{cursor:default}
.wday .wd{font-size:12px;font-weight:600;color:var(--ink-2)}
.wday .wn{font-family:var(--display);font-weight:700;font-size:19px;line-height:1}
.wday.today .wn{text-decoration:underline;text-decoration-color:var(--mustard);text-decoration-thickness:3px;text-underline-offset:3px}
.wdot{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;margin-top:4px;position:relative;background:color-mix(in srgb,var(--cat,#8C9A92) 28%,var(--surface))}
.wdot.free{background:none;border:1.5px dashed var(--line);color:var(--ink-2)}
.wday.past .wd,.wday.past .wn{opacity:.45}
.wday.past .wdot.free{opacity:.4}
.wdot .ok{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;border:2px solid var(--surface)}
.shopcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.shopcard:hover{border-color:var(--ink-2)}
.shopcard .sc-ico{width:48px;height:48px;border-radius:14px;background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok);display:grid;place-items:center;flex-shrink:0}
.shopcard .sc-main{flex:1;min-width:0}
.shopcard b{display:block;font-size:17px}
.shopcard small{display:block;color:var(--ink-2);font-size:14px;margin:2px 0 8px}
.shopcard .progress{display:block;height:8px;width:100%}
.ideas{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.ideas::-webkit-scrollbar{display:none}
.ideas{scroll-padding-inline:18px}
/* Au-delà de la largeur d'un téléphone, la colonne ne touche plus les bords : pas de débordement */
@media (min-width:640px){
  .ideas,.dishes,.filters{margin-left:0;margin-right:0;padding-left:0;padding-right:0;scroll-padding-inline:0}
}
.idea{flex:0 0 156px;scroll-snap-align:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;padding:0;display:flex;flex-direction:column}
.idea:hover{border-color:var(--ink-2)}
.idea .ph{height:96px;display:grid;place-items:center;font-size:44px;background:color-mix(in srgb,var(--cat) 30%,var(--surface))}
.idea .tx{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.idea .nm{font-weight:600;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.idea .mt{font-size:13px;color:var(--ink-2);margin-top:auto}
.tonight.empty-night .when{margin-bottom:6px}
.tonight.empty-night p{position:relative;opacity:.85;margin:0 0 16px;padding-right:60px}
.soft{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:18px;color:var(--ink-2)}
.set-input{display:block;width:100%;margin-top:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:16px}

/* Saison, recevoir, quotidien */
.tag-season{color:var(--ok);font-weight:600}
.tag-off{color:var(--tomato);font-weight:600;font-style:normal}
.season{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.45;color:var(--ink)}
.season svg{margin-top:1px}
.season.ok{background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.season.ok svg{color:var(--ok)}
.season.off{background:color-mix(in srgb,var(--tomato) 10%,var(--surface))}
.season.off svg{color:var(--tomato)}
.season-list{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.45}
.season-list svg{color:var(--ok);margin-top:2px}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.qchips .chip{display:inline-flex;align-items:center;gap:5px}
.chip.seas{border-color:var(--ok);color:var(--ok)}
.sec-head.sm{margin:20px 0 10px}
.sec-head.sm h3{margin:0}
.xacts{display:flex;align-items:center;gap:2px}
.star{width:34px;height:34px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink-2)}
.star:hover{background:var(--surface-2)}
.star.on{color:var(--mustard)}
.star.on svg{fill:currentColor}
.menu-hero{font-size:46px;line-height:1;margin:4px 0 8px}
.course{display:flex;flex-direction:column;align-items:flex-start;min-width:0;text-align:left}
.course small{font-size:12px;font-weight:700;color:var(--ink-2)}
.dayopt .course{text-align:left;color:var(--ink);font-size:16px}
.dayopt .course b{font-weight:600}
.dayopt > span:last-child{white-space:nowrap}
.back{display:inline-flex;align-items:center;gap:4px;margin:0 0 4px}
.idea.menu-card{flex-basis:178px}
.menu-card .mt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;line-height:1.35}
.add-daily{margin-top:14px}
.mlist{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;margin-top:16px}
.mrow{display:flex;align-items:center;gap:6px;padding:10px 8px 10px 14px;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.mmain{flex:1;min-width:0;border:0;background:none;padding:2px 0;text-align:left}
.mmain:hover b{text-decoration:underline}
.macts{display:flex;gap:4px;flex-shrink:0}
.icon-btn.sm{width:36px;height:36px}
.cmeta{font-size:13px;color:var(--ink-2)}
.dayopt .tag-season,.mrow .tag-season{color:var(--ok)}
.dayopt .tag-off,.mrow .tag-off{color:var(--tomato)}
.course b{font-weight:600;line-height:1.3}
.madd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px}
.madd > span{font-size:14px;font-weight:600;color:var(--ink-2);margin-right:2px}
.madd .chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;padding:6px 11px}
.empty .add-daily{margin:10px 0 0 8px}

/* Liste des jours */
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.day{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;padding:14px 12px 14px 16px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.dcol{line-height:1.1}
.dname{font-size:13px;color:var(--ink-2);font-weight:600}
.dnum{font-family:var(--display);font-weight:700;font-size:26px}
.day.today .dnum{text-decoration:underline;text-decoration-color:var(--mustard);text-decoration-thickness:4px;text-underline-offset:3px}
.dmain{min-width:0}
.dmain.link{cursor:pointer}
.rname{font-weight:600;font-size:16px;line-height:1.25}
.rmeta{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:13px;color:var(--ink-2);margin-top:3px}
.st-ready{color:var(--ok);font-weight:600}
.st-todo{color:var(--ink-2)}
.st-done{color:var(--ok);font-weight:600}
.day.done .rname{text-decoration:line-through;color:var(--ink-2)}
.free{color:var(--ink-2);font-size:15px}
.free-acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.day.off .dcol,.day.off .free{opacity:.55}

.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:26px 22px;text-align:center;margin-bottom:20px}
.empty h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.015em;line-height:1.15;margin-bottom:8px}
.empty p{color:var(--ink-2);max-width:38ch;margin:0 auto 16px}

/* Courses */
.summary{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:8px}
.summary b{font-family:var(--display);font-size:22px;font-weight:700}
.summary span{color:var(--ink-2);font-size:14px}
.progress{height:10px;background:var(--surface);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}
.dishes{display:flex;gap:8px;overflow-x:auto;margin:16px -18px 4px;padding:0 18px 6px;scrollbar-width:none}
.dishes::-webkit-scrollbar{display:none}
.dish{flex-shrink:0;display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;font-size:14px;text-align:left;max-width:220px}
.dish small{display:block;color:var(--ink-2);font-size:12px}
.dish .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px}
.dish.ready{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface))}
.dish.ready small{color:var(--ok);font-weight:600}
.aisle h3{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;margin:22px 0 8px}
.items{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.item{display:grid;grid-template-columns:26px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--ink-2);display:grid;place-items:center;color:transparent}
.item.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.iname{font-weight:500;line-height:1.3}
.ifor{display:block;font-size:12px;color:var(--ink-2);margin-top:1px}
.iqty{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.item.on .iname,.item.on .iqty{text-decoration:line-through;color:var(--ink-2);font-weight:500}
.xdel{background:none;border:0;color:var(--ink-2);font-size:20px;line-height:1;padding:0 4px}
.xform{display:flex;gap:8px;margin-top:10px}
.xform input{flex:1;min-width:0;padding:11px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:16px}
details.plac{margin-top:22px}
details.plac summary{list-style:none;cursor:pointer;font-family:var(--display);font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center}
details.plac summary::-webkit-details-marker{display:none}
details.plac summary span{font-family:var(--body);font-weight:500;font-size:14px;color:var(--ink-2)}
details.plac .items{margin-top:8px}
.list-acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.list-acts .btn{flex:1}

/* Recettes */
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--ink-2);pointer-events:none}
.search input{width:100%;padding:12px 16px 12px 44px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:16px}
.search input:focus{outline:none;border-color:var(--forest)}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -18px 16px;padding:0 18px 4px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.time-filters{margin-top:-8px}
.time-filters .chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:6px 12px}
.time-filters.in-sheet{margin:12px -20px 0;padding:0 20px 4px}
.rlist{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.rrow{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:11px 10px 11px 12px;border-top:1px solid var(--line);cursor:pointer}
.rrow:first-child{border-top:0}
.rrow:hover{background:var(--surface-2)}
.tile{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--cat) 26%,var(--surface))}
.tile.big{width:60px;height:60px;font-size:30px;border-radius:18px}
.heart{width:42px;height:42px;border-radius:50%;border:0;background:none;display:grid;place-items:center;color:var(--ink-2)}
.heart:hover{background:var(--surface-2)}
.heart.on{color:var(--tomato)}
.heart.on svg{fill:currentColor}
.count-line{font-size:14px;color:var(--ink-2);margin:-4px 0 14px}
.noresult{padding:26px;text-align:center;color:var(--ink-2)}

/* Barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--surface) 92%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom))}
.tabbar .inner{display:flex;max-width:520px;margin:0 auto}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 4px;border:0;background:none;color:var(--ink-2);font-weight:600;font-size:12px;position:relative;border-radius:14px}
.tab.on{color:var(--brand-ink)}
.tab.on svg{stroke-width:2.4}
.badge{position:absolute;top:2px;left:calc(50% + 7px);background:var(--tomato);color:#fff;font-size:11px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:19px;text-align:center;line-height:16px}

/* Panneau (sheet) */
.backdrop{position:fixed;inset:0;background:rgba(8,16,12,.5);z-index:65;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:66;max-width:640px;margin:0 auto;max-height:92vh;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:26px 26px 0 0;padding:8px 20px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.sheet.show{transform:none;visibility:visible}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet-x{position:absolute;top:14px;right:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink)}
@media (min-width:720px){
  .sheet{top:50%;bottom:auto;left:50%;right:auto;width:600px;border-radius:26px;transform:translate(-50%,-46%);opacity:0;transition:transform .22s,opacity .22s;padding-top:20px}
  .sheet.show{transform:translate(-50%,-50%);opacity:1}
  .grab{display:none}
}
.sheet-h{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em;line-height:1.1;margin:4px 48px 6px 0}
.sheet-sub{color:var(--ink-2);margin-bottom:16px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:19px;margin:22px 0 10px}

.det-head{display:flex;align-items:center;justify-content:space-between;margin:6px 44px 12px 0}
.det-title{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,32px);letter-spacing:-.025em;line-height:1.05}
.det-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-2);font-size:14px;margin-top:8px}
.det-plan{display:inline-block;margin-top:12px;background:color-mix(in srgb,var(--mustard) 30%,var(--surface));color:var(--ink);font-weight:600;font-size:13px;border-radius:99px;padding:4px 12px}
.portions{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface-2);border-radius:var(--r-md);padding:10px 10px 10px 16px;margin-top:18px;font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;display:grid;place-items:center}
.stepper b{min-width:30px;text-align:center;font-variant-numeric:tabular-nums;font-size:17px}
.ings{list-style:none}
.ings li{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line)}
.ings li:last-child{border-bottom:0}
.ings b{white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{list-style:none;counter-reset:st}
.steps li{counter-increment:st;position:relative;padding:0 0 14px 40px;line-height:1.5}
.steps li::before{content:counter(st);position:absolute;left:0;top:-1px;width:28px;height:28px;border-radius:50%;background:var(--forest);color:var(--on-forest);font-weight:700;font-size:14px;display:grid;place-items:center}
.det-actions{display:grid;gap:10px;margin-top:20px}
.det-more{display:flex;gap:10px;margin-top:10px}
.det-more .btn{flex:1}
.danger-link{color:var(--tomato)!important}

.menu{display:grid;gap:4px;margin-top:10px}
.menu > button{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 12px;border-radius:14px;border:0;background:none;font-weight:600;font-size:16px}
.menu > button:hover{background:var(--surface-2)}
.menu > button svg{color:var(--ink-2)}
.menu .danger{color:var(--tomato)}
.menu .danger svg{color:var(--tomato)}
.menu-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;font-weight:600}

.pick-list{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.pick-sec{font-size:13px;font-weight:700;color:var(--ink-2);padding:10px 14px 6px;background:var(--surface-2)}
.dayopt{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:0;border-top:1px solid var(--line);background:none}
.dayopt:first-child{border-top:0}
.dayopt:hover{background:var(--surface-2)}
.dayopt b{font-weight:600}
.dayopt span{color:var(--ink-2);font-size:14px;text-align:right}

/* Réglages et formulaires */
.set-sec{padding:16px 0;border-top:1px solid var(--line)}
.set-sec:first-of-type{border-top:0}
.set-sec h3{margin:0 0 4px;font-size:17px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}
.daypick{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.daypick .chip{width:44px;padding:8px 0;text-align:center}
.seg{display:flex;background:var(--surface-2);border-radius:999px;padding:4px;margin-top:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:999px;font-weight:600;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row-btns{display:flex;gap:10px;margin-top:10px}
.row-btns .btn{flex:1}
form label{display:block;font-weight:600;font-size:14px;margin-top:14px}
form input,form select,form textarea{display:block;width:100%;margin-top:6px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2);font-size:16px;font-weight:400}
form textarea{resize:vertical;line-height:1.45}
form input:focus,form select:focus,form textarea:focus{outline:none;border-color:var(--forest)}
.row2{display:grid;grid-template-columns:1.3fr 1fr;gap:12px}

/* Mode cuisine */
.cook{position:fixed;inset:0;z-index:60;background:var(--forest);color:var(--on-forest);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 18px calc(18px + env(safe-area-inset-bottom))}
.cook.show{display:flex}
.cook-top{display:flex;align-items:center;gap:10px;max-width:720px;width:100%;margin:0 auto}
.cook-top .icon-btn{background:transparent;border-color:rgba(255,255,255,.3);color:var(--on-forest)}
.cook-title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
.cook-chip{border:1px solid rgba(255,255,255,.3);background:transparent;color:var(--on-forest);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.ctimer{border:0;background:var(--mustard);color:var(--on-mustard);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.ctimer.ring{animation:ring 1s infinite}
@keyframes ring{50%{transform:scale(1.07)}}
.segs{display:flex;gap:5px;max-width:720px;width:100%;margin:16px auto 0}
.segs i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.2)}
.segs i.on{background:var(--mustard)}
.cook-body{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:720px;width:100%;margin:0 auto;padding:24px 0;overflow-y:auto}
.cook-label{color:var(--mustard);font-weight:700;font-size:16px;margin-bottom:12px}
.cook-text{font-family:var(--display);font-weight:600;font-size:clamp(26px,6.4vw,40px);line-height:1.2;letter-spacing:-.015em}
.cook-timer-btn{align-self:flex-start;margin-top:26px}
.cook-nav{display:flex;gap:12px;max-width:720px;width:100%;margin:0 auto}
.cook-nav .btn{flex:1;padding:16px;font-size:17px}
.cook-end p:not(.cook-text){opacity:.85;margin-top:14px;font-size:17px;max-width:40ch}
.cook-end .btn{align-self:flex-start;margin-top:22px}
.cook .heart-big svg{fill:none}
.cook .heart-big.on svg{fill:currentColor}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));z-index:90;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--ink);color:var(--surface);font-weight:600;font-size:15px;padding:12px 18px;border-radius:16px;max-width:calc(100% - 32px);width:max-content;transition:opacity .22s,transform .22s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* Grands écrans : menu latéral et mises en page en colonnes */
.brand{display:none}
@media (min-width:1024px){
  body{padding-left:240px}
  .app{max-width:1200px;padding:44px 48px 72px}
  .tabbar{top:0;bottom:0;left:0;right:auto;width:240px;padding:28px 16px;border-top:0;border-right:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}
  .brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;padding:0 10px 26px}
  .brand-mark{width:30px;height:30px;border-radius:50%;background:var(--forest);box-shadow:inset 0 0 0 6px var(--mustard)}
  .tabbar .inner{flex-direction:column;max-width:none;margin:0;gap:4px}
  .tab{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:11px 14px;font-size:15px}
  .tab:hover{background:var(--surface-2)}
  .tab.on{background:color-mix(in srgb,var(--forest) 12%,var(--surface))}
  .badge{position:static;margin-left:auto}
  .toast{bottom:32px;left:calc(50% + 120px)}
  .top h1{font-size:46px}
  .weeknav{max-width:560px}
  .btn-block.mt{max-width:420px}

  /* Accueil en tableau de bord */
  .home-hi{font-size:56px}
  .home-lead{max-width:52ch}
  .home-grid{display:grid;grid-template-columns:1.15fr 1fr;grid-template-areas:"tonight week" "tonight shop" "season season" "recv recv" "quick quick" "favs favs";column-gap:32px;align-items:start}
  .h-tonight{grid-area:tonight;align-self:stretch;display:flex;padding-top:62px}
  .h-tonight .tonight{flex:1;margin:0;min-height:320px;display:flex;flex-direction:column;justify-content:flex-end;padding:28px}
  .h-tonight .tonight h2{font-size:46px}
  .h-week{grid-area:week}.h-shop{grid-area:shop}.h-season{grid-area:season}.h-recv{grid-area:recv}.h-quick{grid-area:quick}.h-favs{grid-area:favs}
  .ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;overflow:visible;margin:0;padding:0}
  .idea,.idea.menu-card{flex:none}
  .h-season .idea:nth-child(n+7),.h-quick .idea:nth-child(n+7){display:none}

  /* Semaine en planning de 7 colonnes */
  .days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .day{position:relative;display:flex;flex-direction:column;align-items:stretch;gap:10px;border-top:0;border-left:1px solid var(--line);padding:16px 14px;min-height:250px}
  .day:first-child{border-left:0}
  .day > .icon-btn{position:absolute;top:10px;right:8px;width:34px;height:34px}
  .day .dmain .rname{font-size:15px;overflow-wrap:anywhere;-webkit-hyphens:auto;hyphens:auto}
  .day .dmain{min-width:0}
  .day .rmeta{flex-direction:column;gap:2px}
  .free-acts{flex-direction:column;align-items:stretch}
  .free-acts .chip{text-align:center}

  /* Courses en colonnes */
  .shop-cols{columns:2;column-gap:28px}
  .shop-cols .aisle{break-inside:avoid;display:inline-block;width:100%}
  .dishes{flex-wrap:wrap;overflow:visible;margin:16px 0 4px;padding:0}
  .add-daily{max-width:420px}

  /* Recettes en grille */
  .search{max-width:620px}
  .filters{flex-wrap:wrap;overflow:visible;margin:0 0 12px;padding:0}
  .time-filters.in-sheet{margin:12px 0 0;padding:0}
  .rlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .rrow:nth-child(2){border-top:0}
  .rrow:nth-child(odd){border-right:1px solid var(--line)}
  .rlist .noresult{grid-column:1/-1}

  /* Panneaux plus larges */
  .sheet{width:720px}
}
@media (min-width:1440px){
  .shop-cols{columns:3}
  .rlist{grid-template-columns:repeat(3,minmax(0,1fr))}
  .rrow:nth-child(3){border-top:0}
  .rrow:nth-child(odd){border-right:0}
  .rrow:not(:nth-child(3n)){border-right:1px solid var(--line)}
}
/* Connexion et synchronisation */
.login{position:fixed;inset:0;z-index:75;background:var(--bg);display:none;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 20px) 20px calc(env(safe-area-inset-bottom) + 20px);overflow-y:auto}
.login.show{display:flex}
.login-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 24px}
.login-brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;margin-bottom:22px}
.login-brand .brand-mark{width:30px;height:30px;border-radius:50%;background:var(--forest);box-shadow:inset 0 0 0 6px var(--mustard)}
.login h1{font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:-.02em;line-height:1.05}
.login-sub{color:var(--ink-2);margin:8px 0 6px}
.login-msg{min-height:20px;margin:12px 0 6px;font-size:14px;color:var(--tomato)}
.login-link{display:block;margin:14px auto 0}
.login-skip{display:block;margin:10px auto 0;color:var(--ink-2)!important;font-weight:600;font-size:14px}
.acct{margin-top:6px}
.sync-line{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:14px;margin-top:4px}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--line);flex-shrink:0}
.sdot.ok{background:var(--ok)}.sdot.pending{background:var(--mustard)}.sdot.offline{background:var(--ink-2)}.sdot.error{background:var(--tomato)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.top h1{font-size:31px}.day{grid-template-columns:44px 1fr auto;gap:10px}}
</style>
</head>
<body>
<main class="app" id="view"></main>
<nav class="tabbar" aria-label="Navigation"><div class="brand"><span class="brand-mark" aria-hidden="true"></span>Au menu</div><div class="inner" id="tabs"></div></nav>
<div class="backdrop" id="backdrop" data-a="close-sheet"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail">
  <div class="grab"></div>
  <button class="sheet-x" data-a="close-sheet" aria-label="Fermer"></button>
  <div id="sheetBody"></div>
</section>
<section class="cook" id="cook" aria-label="Mode cuisine"></section>
<section class="login" id="login" aria-label="Connexion"></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

{id:'b01',n:'Poulet au curry et lait de coco',c:'Volaille',t:30,i:[['Blancs de poulet',300,'g','viande'],['Lait de coco',20,'cl','epi'],['Oignon',1,'','leg'],['Pâte de curry',1,'c. à s.','epi'],['Riz basmati',150,'g','epi'],['Coriandre',1,'botte','leg'],["Huile d'olive",1,'c. à s.','plac']],s:["Rincer le riz puis le cuire dans 2 fois son volume d'eau salée : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Émincer l'oignon et couper le poulet en dés.","Dans une sauteuse, chauffer l'huile à puissance 7. Faire revenir l'oignon 3 min, puis le poulet 5 min jusqu'à ce qu'il soit doré.","Ajouter la pâte de curry, mélanger 1 min, puis verser le lait de coco.","Baisser à puissance 4 et laisser mijoter 10 min. Servir avec le riz et la coriandre ciselée."]},
{id:'b02',n:'Saumon au four, haricots verts et citron',c:'Poisson',t:25,i:[['Pavés de saumon',2,'','viande'],['Haricots verts surgelés',300,'g','surg'],['Citron',1,'','leg'],['Ail',1,'gousse','leg'],["Huile d'olive",2,'c. à s.','plac']],s:["Préchauffer le four à 200 °C.","Poser les pavés sur une plaque, arroser d'un filet d'huile, saler, poivrer et ajouter quelques rondelles de citron. Enfourner 15 min.","Pendant ce temps, cuire les haricots verts dans l'eau bouillante salée à puissance 9 pendant 8 min, puis égoutter.","Faire sauter les haricots avec l'ail émincé et le reste d'huile à puissance 6 pendant 3 min.","Servir le saumon avec les haricots et un filet de jus de citron."]},
{id:'b03',n:'Pâtes au pesto, tomates cerises et mozzarella',c:'Végé',t:15,i:[['Penne',200,'g','epi'],['Pesto',3,'c. à s.','epi'],['Tomates cerises',250,'g','leg'],['Mozzarella',1,'boule','cremerie'],['Parmesan',30,'g','cremerie']],s:["Cuire les pâtes dans une grande casserole d'eau salée : puissance 9 jusqu'à ébullition, puis puissance 8 pendant 10 min.","Couper les tomates cerises en deux et la mozzarella en dés.","Égoutter les pâtes en gardant 2 c. à s. d'eau de cuisson, puis les mélanger hors du feu avec le pesto et cette eau.","Ajouter les tomates, la mozzarella et le parmesan râpé. Servir aussitôt."]},
{id:'b04',n:'Chili con carne',c:'Viande',t:40,i:[['Bœuf haché',300,'g','viande'],['Haricots rouges en boîte',400,'g','epi'],['Tomates concassées',400,'g','epi'],['Oignon',1,'','leg'],['Poivron rouge',1,'','leg'],['Épices chili',1,'c. à c.','epi'],['Riz basmati',150,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Émincer l'oignon et couper le poivron en dés.","Dans une cocotte, chauffer l'huile à puissance 7 et faire revenir l'oignon et le poivron 4 min.","Ajouter le bœuf haché et le faire dorer 5 min en l'émiettant.","Ajouter les épices, les tomates et les haricots rincés. Baisser à puissance 4 et laisser mijoter 20 min en remuant de temps en temps.","Pendant ce temps, cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min. Servir ensemble."]},
{id:'b05',n:'Omelette aux champignons et salade verte',c:'Œufs',t:15,i:[['Œufs',5,'','cremerie'],['Champignons de Paris',200,'g','leg'],['Beurre',15,'g','cremerie'],['Salade verte',1,'','leg'],["Huile d'olive",1,'c. à s.','plac'],['Vinaigre',1,'c. à s.','plac']],s:["Émincer les champignons et les faire sauter dans la moitié du beurre à puissance 7 pendant 5 min.","Battre les œufs avec du sel et du poivre.","Ajouter le reste du beurre dans la poêle, verser les œufs sur les champignons et baisser à puissance 5. Cuire 4 min en ramenant les bords vers le centre.","Plier l'omelette et servir avec la salade assaisonnée d'huile et de vinaigre."]},
{id:'b06',n:'Risotto aux champignons',c:'Végé',t:35,i:[['Riz arborio',160,'g','epi'],['Champignons de Paris',250,'g','leg'],['Oignon',1,'','leg'],['Bouillon de légumes',1,'cube','epi'],['Vin blanc',10,'cl','epi'],['Parmesan',40,'g','cremerie'],['Beurre',20,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Préparer 75 cl de bouillon avec le cube et le garder chaud à puissance 2.","Émincer l'oignon et les champignons, puis les faire revenir dans l'huile à puissance 6 pendant 5 min.","Ajouter le riz et le nacrer 2 min en remuant, puis verser le vin blanc.","À puissance 5, ajouter le bouillon louche par louche en attendant qu'il soit absorbé avant d'en remettre, pendant 18 min.","Hors du feu, incorporer le beurre et le parmesan râpé. Couvrir 2 min avant de servir."]},
{id:'b07',n:'Steak haché et purée maison',c:'Viande',t:30,i:[['Steaks hachés',2,'','viande'],['Pommes de terre',600,'g','leg'],['Lait',15,'cl','cremerie'],['Beurre',30,'g','cremerie'],['Salade verte',1,'','leg']],s:["Éplucher les pommes de terre, les couper en morceaux et les cuire dans l'eau salée : puissance 9 jusqu'à ébullition, puis puissance 7 pendant 20 min.","Égoutter et écraser au presse-purée avec le beurre et le lait chauffé 2 min à puissance 4. Saler, poivrer.","Cuire les steaks dans une poêle bien chaude à puissance 8, 3 min de chaque côté selon la cuisson voulue.","Servir avec la purée et la salade."]},
{id:'b08',n:'Poulet rôti et légumes du four',c:'Volaille',t:50,i:[['Cuisses de poulet',2,'','viande'],['Pommes de terre',400,'g','leg'],['Carottes',3,'','leg'],['Oignon rouge',1,'','leg'],['Herbes de Provence',1,'c. à c.','epi'],["Huile d'olive",2,'c. à s.','plac']],s:["Préchauffer le four à 210 °C.","Couper les pommes de terre et les carottes en morceaux, l'oignon en quartiers.","Disposer les légumes et les cuisses dans un plat, arroser d'huile, parsemer d'herbes, saler et poivrer.","Enfourner 40 min en retournant les légumes à mi-cuisson."]},
{id:'b09',n:'Dahl de lentilles corail',c:'Végé',t:30,i:[['Lentilles corail',150,'g','epi'],['Lait de coco',20,'cl','epi'],['Tomates concassées',400,'g','epi'],['Oignon',1,'','leg'],['Ail',2,'gousse','leg'],['Gingembre frais',10,'g','leg'],['Curry en poudre',2,'c. à c.','epi'],['Riz basmati',120,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Émincer l'oignon et l'ail, râper le gingembre. Les faire revenir dans l'huile à puissance 6 pendant 3 min.","Ajouter le curry, mélanger 1 min, puis les lentilles rincées, les tomates, le lait de coco et 30 cl d'eau.","Porter à ébullition à puissance 8, puis laisser mijoter à puissance 4 pendant 20 min en remuant.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min. Servir le dahl avec le riz."]},
{id:'b10',n:'Cabillaud, riz et sauce vierge',c:'Poisson',t:25,i:[['Dos de cabillaud',2,'','viande'],['Riz basmati',150,'g','epi'],['Tomates',2,'','leg'],['Échalote',1,'','leg'],['Basilic',1,'botte','leg'],['Citron',1,'','leg'],["Huile d'olive",4,'c. à s.','plac']],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Préparer la sauce vierge : tomates en petits dés, échalote ciselée, basilic, jus d'un demi-citron et 3 c. à s. d'huile.","Cuire le cabillaud dans une poêle avec le reste d'huile à puissance 6, 4 min de chaque côté.","Servir le poisson sur le riz, nappé de sauce vierge."]},
{id:'b11',n:'Quiche lorraine et salade',c:'Porc',t:50,i:[['Pâte brisée',1,'rouleau','cremerie'],['Lardons',150,'g','viande'],['Œufs',3,'','cremerie'],['Crème fraîche',20,'cl','cremerie'],['Lait',10,'cl','cremerie'],['Emmental râpé',50,'g','cremerie'],['Salade verte',1,'','leg']],s:["Préchauffer le four à 180 °C et garnir un moule avec la pâte.","Faire dorer les lardons à sec dans une poêle à puissance 7 pendant 5 min.","Battre les œufs avec la crème et le lait, poivrer. Répartir les lardons et le fromage sur la pâte, puis verser l'appareil.","Enfourner 35 min jusqu'à ce que la quiche soit dorée. Servir avec la salade."]},
{id:'b12',n:'Wok de bœuf aux légumes',c:'Viande',t:20,i:[['Rumsteck',300,'g','viande'],['Poivron rouge',1,'','leg'],['Brocoli',1,'','leg'],['Oignon',1,'','leg'],['Gingembre frais',10,'g','leg'],['Sauce soja',3,'c. à s.','epi'],['Nouilles chinoises',150,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Cuire les nouilles selon le paquet, puis les égoutter.","Émincer finement le bœuf, couper le poivron et l'oignon en lamelles et le brocoli en petits bouquets.","Chauffer l'huile dans un wok à puissance 9 et saisir le bœuf 2 min. Le réserver.","Faire sauter les légumes et le gingembre râpé à puissance 8 pendant 5 min.","Remettre le bœuf, ajouter les nouilles et la sauce soja, mélanger 1 min et servir."]},
{id:'b13',n:'Gratin de coquillettes au jambon',c:'Porc',t:35,i:[['Coquillettes',200,'g','epi'],['Jambon blanc',4,'tranche','viande'],['Crème fraîche',20,'cl','cremerie'],['Emmental râpé',80,'g','cremerie']],s:["Préchauffer le four à 200 °C.","Cuire les coquillettes dans l'eau salée à puissance 9, 2 min de moins que le temps indiqué, puis égoutter.","Mélanger les pâtes avec le jambon coupé en morceaux, la crème et la moitié du fromage. Poivrer.","Verser dans un plat, couvrir du reste de fromage et enfourner 20 min."]},
{id:'b14',n:'Shakshuka',c:'Œufs',t:25,i:[['Œufs',4,'','cremerie'],['Tomates concassées',400,'g','epi'],['Poivron rouge',1,'','leg'],['Oignon',1,'','leg'],['Ail',1,'gousse','leg'],['Cumin',1,'c. à c.','epi'],['Baguette',1,'','pain'],["Huile d'olive",1,'c. à s.','plac']],s:["Émincer l'oignon, l'ail et le poivron, puis les faire revenir dans l'huile à puissance 6 pendant 6 min.","Ajouter le cumin puis les tomates. Laisser mijoter à puissance 4 pendant 10 min.","Creuser 4 puits dans la sauce et y casser les œufs. Couvrir et cuire à puissance 3 pendant 6 min, jusqu'à ce que les blancs soient pris.","Servir directement dans la poêle avec du pain."]},
{id:'b15',n:'Velouté de potiron et tartines au comté',c:'Végé',t:35,i:[['Potiron',800,'g','leg'],['Pommes de terre',150,'g','leg'],['Oignon',1,'','leg'],['Bouillon de légumes',1,'cube','epi'],['Crème fraîche',10,'cl','cremerie'],['Pain de campagne',4,'tranche','pain'],['Comté',60,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Éplucher le potiron et les pommes de terre, les couper en cubes. Émincer l'oignon.","Faire revenir l'oignon dans l'huile à puissance 6 pendant 3 min, ajouter les légumes, le cube émietté et couvrir d'eau.","Porter à ébullition à puissance 9, puis cuire à puissance 5 pendant 20 min.","Mixer avec la crème. Pendant ce temps, faire griller les tartines garnies de comté 5 min sous le gril du four."]},
{id:'b16',n:'Tacos de poulet et guacamole',c:'Volaille',t:25,i:[['Blancs de poulet',300,'g','viande'],['Tortillas',6,'','epi'],['Avocat',1,'','leg'],['Tomates',2,'','leg'],['Oignon rouge',1,'','leg'],['Citron vert',1,'','leg'],['Épices fajitas',1,'c. à s.','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Couper le poulet en lanières et l'enrober d'épices.","Le faire dorer dans l'huile à puissance 7 pendant 8 min.","Préparer le guacamole : avocat écrasé avec le jus du citron vert, sel et poivre. Couper les tomates et l'oignon en dés.","Réchauffer les tortillas 30 secondes à sec dans la poêle à puissance 6, puis les garnir."]},
{id:'b17',n:'Pad thaï aux crevettes',c:'Poisson',t:25,i:[['Nouilles de riz',150,'g','epi'],['Crevettes décortiquées',200,'g','viande'],['Œufs',2,'','cremerie'],['Pousses de soja',100,'g','leg'],['Cacahuètes',30,'g','epi'],['Sauce soja',2,'c. à s.','epi'],['Citron vert',1,'','leg'],['Oignons nouveaux',2,'','leg'],["Huile d'olive",1,'c. à s.','plac']],s:["Faire tremper les nouilles 10 min dans de l'eau chaude, puis les égoutter.","Dans un wok à puissance 8, faire sauter les crevettes dans l'huile 3 min, puis les pousser sur le côté et y brouiller les œufs.","Ajouter les nouilles, la sauce soja, le jus de citron vert et les pousses de soja. Mélanger 2 min.","Servir avec les cacahuètes concassées et les oignons nouveaux émincés."]},
{id:'b18',n:'Lasagnes à la bolognaise',c:'Viande',t:75,i:[['Bœuf haché',300,'g','viande'],['Feuilles de lasagne',9,'','epi'],['Coulis de tomate',500,'g','epi'],['Béchamel',50,'cl','epi'],['Oignon',1,'','leg'],['Carottes',1,'','leg'],['Emmental râpé',60,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Émincer l'oignon et la carotte, les faire revenir dans l'huile à puissance 6 pendant 5 min.","Ajouter la viande, la faire dorer 5 min à puissance 7, puis verser le coulis. Laisser mijoter à puissance 3 pendant 15 min.","Préchauffer le four à 180 °C. Dans un plat, alterner béchamel, feuilles et bolognaise sur 3 couches.","Terminer par la béchamel et le fromage. Enfourner 35 min."]},
{id:'b19',n:'Filet mignon à la moutarde et pommes de terre sautées',c:'Porc',t:40,i:[['Filet mignon de porc',400,'g','viande'],['Pommes de terre',500,'g','leg'],["Moutarde à l'ancienne",2,'c. à s.','epi'],['Crème fraîche',15,'cl','cremerie'],['Échalote',1,'','leg'],['Beurre',15,'g','cremerie'],["Huile d'olive",2,'c. à s.','plac']],s:["Couper les pommes de terre en cubes et les faire sauter dans l'huile à puissance 7 : 10 min à couvert, puis 15 min à découvert en remuant.","Couper le filet mignon en médaillons de 2 cm.","Dans une autre poêle, dorer les médaillons dans le beurre à puissance 7, 3 min de chaque côté. Réserver.","Faire revenir l'échalote ciselée 2 min à puissance 5, ajouter la moutarde et la crème, puis remettre la viande 5 min à puissance 3."]},
{id:'b20',n:'Bowl patate douce et pois chiches rôtis',c:'Végé',t:35,i:[['Patate douce',1,'','leg'],['Pois chiches en boîte',400,'g','epi'],['Quinoa',120,'g','epi'],['Avocat',1,'','leg'],['Jeunes pousses',100,'g','leg'],['Graines de sésame',1,'c. à s.','epi'],['Paprika',1,'c. à c.','epi'],['Citron',1,'','leg'],["Huile d'olive",3,'c. à s.','plac']],s:["Préchauffer le four à 200 °C. Couper la patate douce en cubes, la mélanger avec les pois chiches égouttés, 1 c. à s. d'huile et le paprika, puis enfourner 25 min.","Cuire le quinoa dans 2 fois son volume d'eau : puissance 9 puis puissance 3 à couvert pendant 12 min.","Préparer une sauce avec le jus du citron, 2 c. à s. d'huile, sel et poivre.","Dresser les bols : quinoa, pousses, légumes rôtis, avocat en tranches, sésame et sauce."]},
{id:'b21',n:'Croque-monsieur et salade',c:'Porc',t:20,i:[['Pain de mie',8,'tranche','pain'],['Jambon blanc',4,'tranche','viande'],['Emmental en tranches',4,'tranche','cremerie'],['Beurre',20,'g','cremerie'],['Salade verte',1,'','leg']],s:["Préchauffer le four à 200 °C en position gril.","Beurrer les tranches de pain, garnir de jambon et de fromage, puis refermer.","Enfourner 10 min en retournant à mi-cuisson, jusqu'à ce qu'ils soient bien dorés.","Servir avec la salade assaisonnée."]},
{id:'b22',n:'Poulet basquaise',c:'Volaille',t:50,i:[['Cuisses de poulet',2,'','viande'],['Poivron rouge',1,'','leg'],['Poivron vert',1,'','leg'],['Tomates concassées',400,'g','epi'],['Oignon',1,'','leg'],['Ail',2,'gousse','leg'],["Piment d'Espelette",1,'pincée','epi'],['Riz basmati',150,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Dorer les cuisses dans l'huile à puissance 7 sur toutes les faces pendant 8 min. Réserver.","Faire revenir l'oignon, l'ail et les poivrons émincés à puissance 6 pendant 6 min.","Ajouter les tomates et le piment, remettre le poulet. Couvrir et laisser mijoter à puissance 3 pendant 30 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:'b23',n:'Spaghetti carbonara',c:'Porc',t:20,i:[['Spaghetti',200,'g','epi'],['Lardons',150,'g','viande'],['Œufs',3,'','cremerie'],['Parmesan',50,'g','cremerie'],['Poivre',null,'','plac']],s:["Cuire les spaghetti dans l'eau salée : puissance 9 jusqu'à ébullition, puis puissance 8 pendant 10 min.","Faire dorer les lardons à sec à puissance 7 pendant 5 min, puis couper le feu.","Mélanger 1 œuf entier et 2 jaunes avec le parmesan râpé et beaucoup de poivre.","Égoutter les pâtes en gardant un peu d'eau, les verser sur les lardons hors du feu, ajouter le mélange aux œufs et 2 c. à s. d'eau de cuisson. Mélanger vivement et servir."]},
{id:'b24',n:'Saumon teriyaki, riz et brocoli',c:'Poisson',t:25,i:[['Pavés de saumon',2,'','viande'],['Sauce teriyaki',4,'c. à s.','epi'],['Riz basmati',150,'g','epi'],['Brocoli',1,'','leg'],['Graines de sésame',1,'c. à s.','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min.","Cuire le brocoli en bouquets dans l'eau bouillante à puissance 9 pendant 6 min.","Saisir le saumon côté peau dans l'huile à puissance 7 pendant 4 min, retourner et cuire encore 2 min.","Baisser à puissance 3, verser la sauce teriyaki et napper le saumon 1 min. Servir avec le riz, le brocoli et le sésame."]},
{id:'b25',n:'Gnocchis poêlés, sauce tomate et mozzarella',c:'Végé',t:20,i:[['Gnocchis',500,'g','cremerie'],['Coulis de tomate',400,'g','epi'],['Ail',1,'gousse','leg'],['Mozzarella',1,'boule','cremerie'],['Basilic',1,'botte','leg'],["Huile d'olive",2,'c. à s.','plac']],s:["Faire revenir l'ail émincé dans 1 c. à s. d'huile à puissance 5 pendant 1 min, ajouter le coulis et laisser mijoter à puissance 3 pendant 10 min.","Faire dorer les gnocchis dans une poêle huilée à puissance 7 pendant 6 min.","Ajouter les gnocchis à la sauce, puis la mozzarella en morceaux. Couvrir 2 min pour la faire fondre.","Parsemer de basilic avant de servir."]},
{id:'b26',n:'Hachis parmentier',c:'Viande',t:50,i:[['Bœuf haché',300,'g','viande'],['Pommes de terre',600,'g','leg'],['Oignon',1,'','leg'],['Lait',15,'cl','cremerie'],['Beurre',30,'g','cremerie'],['Emmental râpé',40,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Cuire les pommes de terre en morceaux dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min. Préchauffer le four à 200 °C.","Faire revenir l'oignon émincé dans l'huile à puissance 6, puis la viande 6 min à puissance 7. Saler, poivrer.","Écraser les pommes de terre avec le beurre et le lait chaud.","Dans un plat, étaler la viande, couvrir de purée puis de fromage. Enfourner 20 min."]},
{id:'b27',n:'Tartiflette',c:'Porc',t:55,i:[['Pommes de terre',600,'g','leg'],['Reblochon',1,'','cremerie'],['Lardons',150,'g','viande'],['Oignon',1,'','leg'],['Crème fraîche',10,'cl','cremerie'],['Salade verte',1,'','leg']],s:["Cuire les pommes de terre entières dans l'eau salée : puissance 9 puis puissance 7 pendant 20 min. Les éplucher et les couper en rondelles.","Préchauffer le four à 200 °C. Faire dorer les lardons et l'oignon émincé à puissance 7 pendant 6 min.","Dans un plat, mélanger pommes de terre, lardons, oignon et crème. Poser le reblochon coupé en deux par-dessus, croûte vers le haut.","Enfourner 25 min. Servir avec la salade."]},
{id:'b28',n:'Velouté poireaux et pommes de terre',c:'Végé',t:35,i:[['Poireaux',3,'','leg'],['Pommes de terre',300,'g','leg'],['Bouillon de légumes',1,'cube','epi'],['Crème fraîche',10,'cl','cremerie'],['Beurre',15,'g','cremerie'],['Pain de campagne',4,'tranche','pain']],s:["Laver et émincer les poireaux, éplucher les pommes de terre et les couper en dés.","Faire fondre les poireaux dans le beurre à puissance 5 pendant 5 min.","Ajouter les pommes de terre, le cube et 80 cl d'eau. Porter à ébullition à puissance 9, puis cuire à puissance 5 pendant 20 min.","Mixer avec la crème et servir avec le pain grillé."]},
{id:'b29',n:'Escalopes de dinde à la crème et tagliatelles',c:'Volaille',t:25,i:[['Escalopes de dinde',2,'','viande'],['Champignons de Paris',200,'g','leg'],['Crème fraîche',20,'cl','cremerie'],['Échalote',1,'','leg'],['Tagliatelles',200,'g','epi'],['Beurre',15,'g','cremerie']],s:["Cuire les tagliatelles dans l'eau salée : puissance 9 puis puissance 8, selon le temps du paquet.","Dorer les escalopes dans le beurre à puissance 7, 3 min de chaque côté. Réserver.","Faire revenir l'échalote et les champignons émincés à puissance 6 pendant 5 min.","Ajouter la crème, remettre les escalopes et laisser réduire 3 min à puissance 3. Servir avec les pâtes."]},
{id:'b30',n:"Crevettes à l'ail, riz et brocoli",c:'Poisson',t:20,i:[['Crevettes décortiquées',250,'g','viande'],['Ail',3,'gousse','leg'],['Brocoli',1,'','leg'],['Riz basmati',150,'g','epi'],['Persil',1,'botte','leg'],['Beurre',20,'g','cremerie'],['Citron',1,'','leg']],s:["Cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min.","Cuire le brocoli en bouquets dans l'eau bouillante à puissance 9 pendant 6 min, puis égoutter.","Faire fondre le beurre à puissance 5, ajouter l'ail haché 1 min, puis les crevettes à puissance 7 pendant 3 min.","Ajouter le persil ciselé et un filet de citron. Servir avec le riz et le brocoli."]},
{id:'b31',n:'Pizza maison jambon et champignons',c:'Porc',t:30,i:[['Pâte à pizza',1,'rouleau','cremerie'],['Coulis de tomate',150,'g','epi'],['Jambon blanc',2,'tranche','viande'],['Champignons de Paris',100,'g','leg'],['Mozzarella',1,'boule','cremerie'],['Herbes de Provence',1,'c. à c.','epi'],['Salade verte',1,'','leg']],s:["Préchauffer le four à 240 °C.","Dérouler la pâte sur la plaque et étaler le coulis.","Répartir le jambon, les champignons émincés, la mozzarella et les herbes.","Enfourner 12 à 15 min, jusqu'à ce que la pâte soit dorée. Servir avec la salade."]},
{id:'b32',n:'Curry de pois chiches et épinards',c:'Végé',t:25,i:[['Pois chiches en boîte',400,'g','epi'],['Épinards surgelés',300,'g','surg'],['Lait de coco',20,'cl','epi'],['Tomates concassées',400,'g','epi'],['Oignon',1,'','leg'],['Curry en poudre',2,'c. à c.','epi'],['Riz basmati',150,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Faire revenir l'oignon émincé dans l'huile à puissance 6 pendant 3 min, puis ajouter le curry 1 min.","Ajouter les tomates, le lait de coco et les pois chiches égouttés. Laisser mijoter à puissance 4 pendant 10 min.","Ajouter les épinards et cuire encore 5 min.","Pendant ce temps, cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min."]},
{id:'b33',n:'Bœuf carottes',c:'Viande',t:150,i:[['Bœuf à braiser',500,'g','viande'],['Carottes',5,'','leg'],['Oignon',1,'','leg'],['Bouillon de bœuf',1,'cube','epi'],['Bouquet garni',1,'','epi'],['Pommes de terre',400,'g','leg'],["Huile d'olive",1,'c. à s.','plac']],s:["Couper la viande en gros cubes et la faire dorer dans l'huile à puissance 8, en plusieurs fois, pendant 6 min.","Ajouter l'oignon émincé, les carottes en rondelles, le cube émietté, le bouquet garni et 50 cl d'eau.","Couvrir et laisser mijoter à puissance 2 pendant 2 h, en remuant de temps en temps.","Ajouter les pommes de terre en morceaux 30 min avant la fin de la cuisson."]},
{id:'b34',n:'Fajitas de bœuf',c:'Viande',t:25,i:[['Rumsteck',300,'g','viande'],['Poivron rouge',1,'','leg'],['Poivron jaune',1,'','leg'],['Oignon',1,'','leg'],['Tortillas',6,'','epi'],['Épices fajitas',1,'c. à s.','epi'],['Fromage blanc',100,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Couper le bœuf, les poivrons et l'oignon en lanières.","Saisir le bœuf avec les épices dans l'huile à puissance 9 pendant 3 min, puis le réserver.","Faire sauter les légumes à puissance 8 pendant 6 min, puis remettre la viande 1 min.","Réchauffer les tortillas et les garnir avec le fromage blanc."]},
{id:'b35',n:'Œufs cocotte, mouillettes et salade',c:'Œufs',t:20,i:[['Œufs',4,'','cremerie'],['Crème fraîche',10,'cl','cremerie'],['Ciboulette',1,'botte','leg'],['Baguette',1,'','pain'],['Beurre',15,'g','cremerie'],['Salade verte',1,'','leg']],s:["Préchauffer le four à 180 °C et faire chauffer de l'eau à puissance 9 pour le bain-marie.","Beurrer 4 ramequins, y verser 1 c. à s. de crème, casser un œuf dans chacun, saler et poivrer.","Placer les ramequins dans un plat, verser l'eau chaude à mi-hauteur et enfourner 10 min.","Parsemer de ciboulette et servir avec les mouillettes de pain grillé et la salade."]},
{id:'b36',n:'Poêlée de pommes de terre, lardons et œuf au plat',c:'Porc',t:30,i:[['Pommes de terre',500,'g','leg'],['Lardons',150,'g','viande'],['Oignon',1,'','leg'],['Œufs',2,'','cremerie'],['Persil',1,'botte','leg'],["Huile d'olive",2,'c. à s.','plac']],s:["Couper les pommes de terre en cubes et les faire sauter dans l'huile à puissance 7 : 10 min à couvert, puis 10 min à découvert.","Ajouter les lardons et l'oignon émincé, poursuivre la cuisson 5 min.","Dans une petite poêle, cuire les œufs au plat à puissance 5 pendant 3 min.","Servir la poêlée parsemée de persil, avec un œuf sur le dessus."]},
{id:'b37',n:'Papillotes de colin et julienne de légumes',c:'Poisson',t:30,i:[['Filets de colin',2,'','viande'],['Carottes',2,'','leg'],['Courgettes',1,'','leg'],['Citron',1,'','leg'],['Pommes de terre grenaille',400,'g','leg'],['Herbes de Provence',1,'c. à c.','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Préchauffer le four à 200 °C. Couper les carottes et la courgette en fines lanières.","Sur deux feuilles de papier cuisson, déposer les légumes, puis le colin, une rondelle de citron, un filet d'huile, les herbes, sel et poivre.","Fermer les papillotes et enfourner 15 min.","Pendant ce temps, cuire les pommes de terre dans l'eau salée : puissance 9 puis puissance 7 pendant 15 min."]},
{id:'b38',n:'Gratin de chou-fleur',c:'Végé',t:40,i:[['Chou-fleur',1,'','leg'],['Béchamel',40,'cl','epi'],['Emmental râpé',80,'g','cremerie'],['Muscade',1,'pincée','plac'],['Baguette',1,'','pain']],s:["Préchauffer le four à 200 °C. Détailler le chou-fleur en bouquets.","Les cuire dans l'eau bouillante salée : puissance 9 puis puissance 7 pendant 8 min. Égoutter soigneusement.","Mélanger le chou-fleur avec la béchamel, la muscade et la moitié du fromage dans un plat.","Couvrir du reste de fromage et enfourner 20 min."]},
{id:'b39',n:'Poulet au citron et aux olives, semoule',c:'Volaille',t:35,i:[['Hauts de cuisse de poulet',4,'','viande'],['Citron',1,'','leg'],['Olives vertes',80,'g','epi'],['Oignon',1,'','leg'],['Bouillon de volaille',1,'cube','epi'],['Cumin',1,'c. à c.','epi'],['Semoule',150,'g','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Dorer le poulet dans l'huile à puissance 7 sur toutes les faces pendant 8 min.","Ajouter l'oignon émincé, le cumin, le citron en quartiers, les olives et 20 cl de bouillon préparé avec le cube.","Couvrir et laisser mijoter à puissance 3 pendant 20 min.","Verser la semoule dans un saladier, couvrir du même volume d'eau bouillante salée, laisser gonfler 5 min puis égrainer."]},
{id:'b40',n:'Burger maison et potatoes',c:'Viande',t:35,i:[['Steaks hachés',2,'','viande'],['Pains à burger',2,'','pain'],['Cheddar en tranches',2,'tranche','cremerie'],['Tomates',1,'','leg'],['Oignon rouge',1,'','leg'],['Salade verte',1,'','leg'],['Potatoes surgelées',400,'g','surg'],['Sauce burger',2,'c. à s.','epi']],s:["Préchauffer le four et cuire les potatoes selon le paquet, environ 25 min.","Couper la tomate et l'oignon en rondelles.","Cuire les steaks à puissance 8, 3 min de chaque côté, en posant le cheddar dessus pendant la dernière minute.","Toaster les pains 1 min à la poêle, puis monter les burgers avec la sauce, la salade, la tomate et l'oignon."]},
{id:'b41',n:'Minestrone',c:'Végé',t:40,i:[['Carottes',2,'','leg'],['Courgettes',1,'','leg'],['Céleri',1,'branche','leg'],['Haricots blancs en boîte',250,'g','epi'],['Tomates concassées',400,'g','epi'],['Petites pâtes',60,'g','epi'],['Bouillon de légumes',1,'cube','epi'],['Parmesan',30,'g','cremerie'],["Huile d'olive",1,'c. à s.','plac']],s:["Couper tous les légumes en petits dés et les faire revenir dans l'huile à puissance 6 pendant 5 min.","Ajouter les tomates, le cube et 1 l d'eau. Porter à ébullition à puissance 9, puis cuire à puissance 5 pendant 20 min.","Ajouter les pâtes et les haricots égouttés, puis cuire encore 10 min.","Servir avec le parmesan râpé."]},
{id:'b42',n:'Saucisses aux lentilles',c:'Porc',t:40,i:[['Saucisses de Toulouse',2,'','viande'],['Lentilles vertes',150,'g','epi'],['Carottes',2,'','leg'],['Oignon',1,'','leg'],['Bouquet garni',1,'','epi']],s:["Rincer les lentilles et les mettre dans une casserole avec les carottes en rondelles, l'oignon et le bouquet garni. Couvrir d'eau froide.","Porter à ébullition à puissance 9, puis cuire à puissance 4 pendant 25 min. Saler en fin de cuisson.","Pendant ce temps, dorer les saucisses à puissance 6 pendant 15 min en les retournant régulièrement.","Servir les saucisses sur les lentilles égouttées."]},
{id:'b43',n:'Riz cantonais',c:'Porc',t:25,i:[['Riz basmati',150,'g','epi'],['Jambon blanc',2,'tranche','viande'],['Œufs',2,'','cremerie'],['Petits pois surgelés',100,'g','surg'],['Oignons nouveaux',2,'','leg'],['Sauce soja',2,'c. à s.','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Cuire le riz : puissance 9 puis puissance 3 à couvert pendant 12 min, puis l'étaler pour qu'il refroidisse.","Brouiller les œufs dans un peu d'huile à puissance 6, puis les réserver.","Faire sauter les petits pois et le jambon en dés à puissance 8 pendant 3 min, ajouter le riz et la sauce soja et cuire 4 min.","Ajouter les œufs et les oignons nouveaux émincés, mélanger et servir."]},
{id:'b44',n:'Spaghetti aux courgettes, citron et parmesan',c:'Végé',t:20,i:[['Spaghetti',200,'g','epi'],['Courgettes',2,'','leg'],['Citron',1,'','leg'],['Ail',1,'gousse','leg'],['Parmesan',40,'g','cremerie'],["Huile d'olive",2,'c. à s.','plac']],s:["Cuire les pâtes dans l'eau salée : puissance 9 puis puissance 8 pendant 10 min.","Râper les courgettes et les faire sauter avec l'ail dans l'huile à puissance 7 pendant 5 min.","Ajouter le zeste et le jus d'un demi-citron.","Mélanger avec les pâtes égouttées, un peu d'eau de cuisson et le parmesan râpé."]},
{id:'b45',n:'Moules marinières et frites',c:'Poisson',t:30,i:[['Moules',1500,'g','viande'],['Échalote',2,'','leg'],['Vin blanc',15,'cl','epi'],['Persil',1,'botte','leg'],['Beurre',20,'g','cremerie'],['Frites surgelées',400,'g','surg']],s:["Cuire les frites au four selon le paquet.","Gratter et rincer les moules, en jetant celles qui sont ouvertes.","Faire fondre le beurre dans une grande casserole à puissance 5, ajouter les échalotes ciselées 2 min, puis le vin blanc.","Ajouter les moules, couvrir et cuire à puissance 9 pendant 6 min en secouant, jusqu'à ce qu'elles s'ouvrent. Parsemer de persil."]},
{id:'b46',n:'Poulet à la moutarde et haricots verts',c:'Volaille',t:30,i:[['Blancs de poulet',300,'g','viande'],['Moutarde',2,'c. à s.','epi'],['Crème fraîche',15,'cl','cremerie'],['Haricots verts surgelés',300,'g','surg'],['Échalote',1,'','leg'],["Huile d'olive",1,'c. à s.','plac']],s:["Cuire les haricots verts dans l'eau bouillante salée à puissance 9 pendant 8 min.","Couper le poulet en morceaux et le dorer dans l'huile à puissance 7 pendant 6 min.","Ajouter l'échalote ciselée 2 min, puis la moutarde et la crème. Laisser réduire à puissance 3 pendant 5 min.","Servir avec les haricots verts."]},
{id:'b47',n:'Enchiladas aux haricots rouges',c:'Végé',t:35,i:[['Tortillas',4,'','epi'],['Haricots rouges en boîte',400,'g','epi'],['Maïs en boîte',150,'g','epi'],['Poivron rouge',1,'','leg'],['Oignon',1,'','leg'],['Coulis de tomate',300,'g','epi'],['Cheddar râpé',80,'g','cremerie'],['Épices fajitas',1,'c. à s.','epi'],["Huile d'olive",1,'c. à s.','plac']],s:["Préchauffer le four à 200 °C. Faire revenir l'oignon et le poivron en dés dans l'huile à puissance 6 pendant 5 min.","Ajouter les haricots, le maïs, les épices et la moitié du coulis. Laisser mijoter 5 min à puissance 4.","Garnir et rouler les tortillas, les placer dans un plat et napper du reste de coulis.","Parsemer de fromage et enfourner 15 min."]},
{id:'b48',n:'Ramen au poulet',c:'Volaille',t:30,i:[['Blancs de poulet',250,'g','viande'],['Nouilles chinoises',150,'g','epi'],['Bouillon de volaille',2,'cube','epi'],['Sauce soja',3,'c. à s.','epi'],['Gingembre frais',10,'g','leg'],['Œufs',2,'','cremerie'],['Champignons de Paris',100,'g','leg'],['Oignons nouveaux',2,'','leg']],s:["Cuire les œufs dans l'eau bouillante à puissance 9 pendant 6 min, puis les refroidir dans l'eau froide et les écaler.","Porter 1 l d'eau à ébullition avec les cubes, la sauce soja et le gingembre râpé à puissance 9, puis baisser à puissance 4.","Ajouter le poulet en fines tranches et les champignons émincés, puis cuire 8 min.","Cuire les nouilles 3 min dans le bouillon. Servir avec les œufs coupés en deux et les oignons nouveaux."]},
{id:'b49',n:'Galettes complètes',c:'Œufs',t:20,i:[['Galettes de sarrasin',4,'','cremerie'],['Jambon blanc',4,'tranche','viande'],['Emmental râpé',80,'g','cremerie'],['Œufs',4,'','cremerie'],['Beurre',20,'g','cremerie'],['Salade verte',1,'','leg']],s:["Faire fondre un peu de beurre dans une grande poêle à puissance 6 et y poser une galette.","Répartir le fromage et le jambon, puis casser un œuf au centre.","Couvrir et cuire 4 min, jusqu'à ce que le blanc soit pris, puis replier les bords.","Recommencer avec les autres galettes et servir avec la salade."]},
{id:'b50',n:'Couscous de légumes et merguez',c:'Viande',t:50,i:[['Merguez',4,'','viande'],['Semoule',150,'g','epi'],['Carottes',2,'','leg'],['Courgettes',1,'','leg'],['Navet',1,'','leg'],['Pois chiches en boîte',250,'g','epi'],['Tomates concassées',200,'g','epi'],['Ras el hanout',1,'c. à s.','epi'],['Oignon',1,'','leg'],["Huile d'olive",1,'c. à s.','plac']],s:["Faire revenir l'oignon émincé dans l'huile à puissance 6 pendant 3 min, puis ajouter le ras el hanout.","Ajouter les légumes en gros morceaux, les tomates et 60 cl d'eau. Cuire à puissance 4 pendant 25 min, en ajoutant les pois chiches les 5 dernières minutes.","Griller les merguez à la poêle à puissance 7 pendant 10 min.","Préparer la semoule avec le même volume d'eau bouillante salée, laisser gonfler 5 min puis égrainer."]},
{id:'b51',n:'Endives au jambon',c:'Porc',t:50,i:[['Endives',4,'','leg'],['Jambon blanc',4,'tranche','viande'],['Béchamel',40,'cl','epi'],['Emmental râpé',60,'g','cremerie'],['Beurre',10,'g','cremerie'],['Baguette',1,'','pain']],s:["Préchauffer le four à 200 °C. Retirer le cône amer à la base des endives.","Les faire fondre dans le beurre à puissance 4, à couvert, pendant 15 min. Bien les égoutter.","Enrouler chaque endive dans une tranche de jambon, les placer dans un plat et napper de béchamel.","Parsemer de fromage et enfourner 20 min."]},
{id:'b52',n:"Tagliatelles au saumon fumé et à l'aneth",c:'Poisson',t:20,i:[['Tagliatelles',200,'g','epi'],['Saumon fumé',120,'g','viande'],['Crème fraîche',15,'cl','cremerie'],['Aneth',1,'botte','leg'],['Citron',1,'','leg']],s:["Cuire les tagliatelles dans l'eau salée : puissance 9 puis puissance 8, selon le temps du paquet.","Faire chauffer la crème à puissance 3 avec le zeste du citron et l'aneth ciselé pendant 3 min.","Hors du feu, ajouter le saumon coupé en lanières.","Mélanger avec les pâtes égouttées et servir avec un filet de jus de citron."]},
{id:"b53",n:"Poulet au citron et au thym, grenailles rôties",c:"Volaille",t:40,i:[["Blancs de poulet",300,"g","viande"],["Pommes de terre grenaille",500,"g","leg"],["Citron",1,"","leg"],["Thym",1,"c. à c.","epi"],["Ail",2,"gousse","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C. Couper les grenailles en deux, les mélanger avec 1 c. à s. d'huile, du sel et la moitié du thym, puis enfourner 30 min.","Mélanger le jus du citron, le reste d'huile, l'ail écrasé et le reste de thym, puis y enrober le poulet.","Dorer le poulet dans une poêle à puissance 7, 2 min de chaque côté.","Ajouter le poulet sur la plaque de grenailles et poursuivre la cuisson 15 min."]},
{id:"b54",n:"Poulet tikka masala et riz",c:"Volaille",t:35,i:[["Blancs de poulet",300,"g","viande"],["Yaourt nature",1,"","cremerie"],["Tomates concassées",400,"g","epi"],["Crème fraîche",10,"cl","cremerie"],["Oignon",1,"","leg"],["Ail",2,"gousse","leg"],["Gingembre frais",10,"g","leg"],["Garam masala",2,"c. à c.","epi"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Couper le poulet en dés et le mélanger avec le yaourt et la moitié du garam masala.","Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Faire revenir l'oignon, l'ail et le gingembre dans l'huile à puissance 6 pendant 4 min. Ajouter le reste d'épices puis le poulet et cuire 5 min à puissance 7.","Ajouter les tomates et laisser mijoter à puissance 4 pendant 12 min. Incorporer la crème et servir avec le riz."]},
{id:"b55",n:"Poulet teriyaki et haricots verts",c:"Volaille",t:25,i:[["Blancs de poulet",300,"g","viande"],["Sauce teriyaki",4,"c. à s.","epi"],["Riz basmati",150,"g","epi"],["Haricots verts surgelés",200,"g","surg"],["Graines de sésame",1,"c. à s.","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Cuire les haricots verts dans l'eau bouillante à puissance 9 pendant 8 min.","Dorer le poulet en morceaux dans l'huile à puissance 7 pendant 6 min.","Baisser à puissance 4, ajouter la sauce teriyaki et laisser caraméliser 2 min. Parsemer de sésame."]},
{id:"b56",n:"Poulet à la crème et aux champignons, riz",c:"Volaille",t:30,i:[["Blancs de poulet",300,"g","viande"],["Champignons de Paris",250,"g","leg"],["Crème fraîche",20,"cl","cremerie"],["Oignon",1,"","leg"],["Riz basmati",150,"g","epi"],["Beurre",15,"g","cremerie"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Dorer le poulet en dés dans le beurre à puissance 7 pendant 6 min, puis le réserver.","Faire revenir l'oignon et les champignons émincés à puissance 6 pendant 6 min.","Remettre le poulet, ajouter la crème et laisser mijoter à puissance 3 pendant 5 min."]},
{id:"b57",n:"Salade César au poulet",c:"Volaille",t:25,i:[["Blancs de poulet",250,"g","viande"],["Salade romaine",1,"","leg"],["Parmesan",30,"g","cremerie"],["Pain de mie",2,"tranche","pain"],["Sauce César",3,"c. à s.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Couper le pain en cubes et les dorer dans 1 c. à s. d'huile à puissance 6 pendant 4 min.","Cuire le poulet dans le reste d'huile à puissance 7, 5 min de chaque côté, puis le trancher.","Laver et couper la salade, ajouter la sauce et mélanger.","Garnir de poulet, de croûtons et de copeaux de parmesan."]},
{id:"b58",n:"Wraps au poulet et crudités",c:"Volaille",t:20,i:[["Blancs de poulet",250,"g","viande"],["Tortillas",4,"","epi"],["Carottes",1,"","leg"],["Salade verte",1,"","leg"],["Tomates",1,"","leg"],["Fromage blanc",100,"g","cremerie"],["Paprika",1,"c. à c.","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Couper le poulet en lanières, le saupoudrer de paprika et le cuire dans l'huile à puissance 7 pendant 7 min.","Râper la carotte, émincer la salade et couper la tomate en dés.","Réchauffer les tortillas 30 secondes à sec à puissance 6.","Tartiner de fromage blanc, garnir de crudités et de poulet, puis rouler."]},
{id:"b59",n:"One pot poulet, chorizo et poivrons",c:"Volaille",t:40,i:[["Hauts de cuisse de poulet",4,"","viande"],["Chorizo",80,"g","viande"],["Poivron rouge",1,"","leg"],["Poivron jaune",1,"","leg"],["Oignon",1,"","leg"],["Riz basmati",150,"g","epi"],["Bouillon de volaille",1,"cube","epi"],["Paprika",1,"c. à c.","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Dorer le poulet dans l'huile à puissance 7 pendant 8 min, puis le réserver.","Faire revenir l'oignon, les poivrons et le chorizo en rondelles à puissance 6 pendant 5 min.","Ajouter le riz, le paprika, 40 cl de bouillon et le poulet. Porter à ébullition à puissance 8.","Couvrir et cuire à puissance 3 pendant 18 min, jusqu'à ce que le bouillon soit absorbé."]},
{id:"b60",n:"Brochettes de poulet marinées et semoule",c:"Volaille",t:30,i:[["Blancs de poulet",300,"g","viande"],["Yaourt nature",1,"","cremerie"],["Citron",1,"","leg"],["Cumin",1,"c. à c.","epi"],["Courgettes",1,"","leg"],["Semoule",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Couper le poulet en cubes et le laisser mariner 10 min avec le yaourt, le jus du citron et le cumin.","Enfiler le poulet et la courgette en rondelles sur des piques.","Cuire les brochettes dans une poêle huilée à puissance 7 pendant 10 min en les retournant.","Préparer la semoule avec le même volume d'eau bouillante salée, laisser gonfler 5 min puis égrainer."]},
{id:"b61",n:"Poulet sauté aux noix de cajou",c:"Volaille",t:25,i:[["Blancs de poulet",300,"g","viande"],["Noix de cajou",50,"g","epi"],["Poivron rouge",1,"","leg"],["Oignon",1,"","leg"],["Sauce soja",3,"c. à s.","epi"],["Miel",1,"c. à s.","epi"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Torréfier les noix de cajou à sec à puissance 6 pendant 3 min, puis les réserver.","Saisir le poulet en dés dans l'huile à puissance 8 pendant 5 min, ajouter le poivron et l'oignon émincés et cuire 4 min.","Ajouter la sauce soja, le miel et les noix de cajou, puis mélanger 1 min à puissance 5."]},
{id:"b62",n:"Pilons de poulet miel-moutarde et patates douces",c:"Volaille",t:45,i:[["Pilons de poulet",6,"","viande"],["Miel",2,"c. à s.","epi"],["Moutarde",1,"c. à s.","epi"],["Patate douce",2,"","leg"],["Paprika",1,"c. à c.","epi"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four à 200 °C.","Mélanger le miel, la moutarde et 1 c. à s. d'huile, puis en badigeonner les pilons.","Couper les patates douces en frites et les mélanger avec le reste d'huile et le paprika.","Enfourner le tout 35 min en retournant à mi-cuisson."]},
{id:"b63",n:"Sauté de dinde au curry et riz",c:"Volaille",t:30,i:[["Escalopes de dinde",2,"","viande"],["Lait de coco",20,"cl","epi"],["Oignon",1,"","leg"],["Carottes",2,"","leg"],["Curry en poudre",2,"c. à c.","epi"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Couper la dinde en lanières et les carottes en fines rondelles.","Dorer la dinde dans l'huile à puissance 7 pendant 5 min, ajouter l'oignon, les carottes et le curry, puis cuire 3 min.","Verser le lait de coco et laisser mijoter à puissance 4 pendant 10 min."]},
{id:"b64",n:"Poulet à l'estragon et haricots verts",c:"Volaille",t:30,i:[["Blancs de poulet",300,"g","viande"],["Crème fraîche",15,"cl","cremerie"],["Estragon",1,"botte","leg"],["Échalote",1,"","leg"],["Haricots verts surgelés",300,"g","surg"],["Beurre",15,"g","cremerie"]],s:["Cuire les haricots verts dans l'eau bouillante salée à puissance 9 pendant 8 min.","Dorer le poulet dans le beurre à puissance 7, 5 min de chaque côté.","Ajouter l'échalote ciselée 2 min, puis la crème et l'estragon ciselé.","Laisser mijoter à puissance 3 pendant 6 min et servir avec les haricots."]},
{id:"b65",n:"Nuggets de poulet maison et potatoes",c:"Volaille",t:30,i:[["Blancs de poulet",300,"g","viande"],["Œufs",1,"","cremerie"],["Chapelure",60,"g","epi"],["Farine",2,"c. à s.","plac"],["Salade verte",1,"","leg"],["Potatoes surgelées",300,"g","surg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four et cuire les potatoes selon le paquet, environ 25 min.","Couper le poulet en morceaux, les passer dans la farine, dans l'œuf battu puis dans la chapelure.","Dorer les nuggets dans l'huile à puissance 7 pendant 8 min en les retournant.","Servir avec les potatoes et la salade."]},
{id:"b66",n:"Nouilles sautées au poulet sauce satay",c:"Volaille",t:25,i:[["Blancs de poulet",250,"g","viande"],["Beurre de cacahuète",2,"c. à s.","epi"],["Sauce soja",2,"c. à s.","epi"],["Lait de coco",10,"cl","epi"],["Nouilles chinoises",150,"g","epi"],["Carottes",1,"","leg"],["Brocoli",1,"","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire les nouilles selon le paquet, puis les égoutter.","Mélanger le beurre de cacahuète, la sauce soja et le lait de coco.","Saisir le poulet en lanières dans l'huile à puissance 8 pendant 5 min, ajouter la carotte en julienne et le brocoli en petits bouquets, puis cuire 4 min.","Ajouter les nouilles et la sauce, puis mélanger 2 min à puissance 5."]},
{id:"b67",n:"Magret de canard et purée de patate douce",c:"Volaille",t:40,i:[["Magret de canard",1,"","viande"],["Patate douce",2,"","leg"],["Beurre",15,"g","cremerie"],["Miel",1,"c. à s.","epi"],["Salade verte",1,"","leg"]],s:["Éplucher les patates douces, les couper en morceaux et les cuire dans l'eau salée : puissance 9 puis puissance 7 pendant 15 min. Les écraser avec le beurre.","Quadriller la peau du magret et le poser côté peau dans une poêle froide. Cuire à puissance 6 pendant 8 min en retirant la graisse.","Retourner et cuire 4 min à puissance 6, puis laisser reposer 5 min sous une feuille d'aluminium.","Déglacer la poêle avec le miel à puissance 4 pendant 1 min, trancher le magret et le napper de sauce."]},
{id:"b68",n:"Penne au poulet, tomates cerises et olives",c:"Volaille",t:25,i:[["Blancs de poulet",250,"g","viande"],["Penne",200,"g","epi"],["Tomates cerises",250,"g","leg"],["Olives noires",50,"g","epi"],["Ail",1,"gousse","leg"],["Basilic",1,"botte","leg"],["Huile d'olive",2,"c. à s.","plac"]],s:["Cuire les pâtes dans l'eau salée : puissance 9 jusqu'à ébullition, puis puissance 8 pendant 10 min.","Dorer le poulet en dés dans l'huile à puissance 7 pendant 6 min.","Ajouter l'ail, les tomates cerises coupées en deux et les olives, puis cuire 4 min à puissance 6.","Mélanger avec les pâtes égouttées et le basilic ciselé."]},
{id:"b69",n:"Bœuf bourguignon",c:"Viande",t:180,i:[["Bœuf à braiser",600,"g","viande"],["Lardons",100,"g","viande"],["Carottes",3,"","leg"],["Champignons de Paris",200,"g","leg"],["Oignon",1,"","leg"],["Vin rouge",50,"cl","epi"],["Bouquet garni",1,"","epi"],["Farine",1,"c. à s.","plac"],["Pommes de terre",500,"g","leg"],["Huile d'olive",1,"c. à s.","plac"]],s:["Dorer la viande en cubes dans l'huile à puissance 8, en plusieurs fois, pendant 8 min. Ajouter les lardons et l'oignon émincé et cuire 3 min.","Saupoudrer de farine, mélanger, puis verser le vin et ajouter les carottes en rondelles et le bouquet garni.","Couvrir et laisser mijoter à puissance 2 pendant 2 h 30, en remuant de temps en temps.","Ajouter les champignons pour les 30 dernières minutes. Cuire les pommes de terre à l'eau (puissance 9 puis puissance 7) et servir ensemble."]},
{id:"b70",n:"Boulettes de bœuf à la tomate et spaghetti",c:"Viande",t:35,i:[["Bœuf haché",300,"g","viande"],["Œufs",1,"","cremerie"],["Chapelure",30,"g","epi"],["Coulis de tomate",400,"g","epi"],["Ail",1,"gousse","leg"],["Spaghetti",200,"g","epi"],["Parmesan",30,"g","cremerie"],["Huile d'olive",1,"c. à s.","plac"]],s:["Mélanger la viande, l'œuf, la chapelure, du sel et du poivre, puis former une quinzaine de boulettes.","Les dorer dans l'huile à puissance 7 pendant 6 min.","Ajouter l'ail et le coulis, puis laisser mijoter à puissance 3 pendant 15 min.","Pendant ce temps, cuire les spaghetti : puissance 9 puis puissance 8 pendant 10 min. Servir avec le parmesan."]},
{id:"b71",n:"Bœuf sauté aux oignons et riz",c:"Viande",t:25,i:[["Rumsteck",300,"g","viande"],["Oignon",2,"","leg"],["Sauce soja",3,"c. à s.","epi"],["Gingembre frais",10,"g","leg"],["Riz basmati",150,"g","epi"],["Huile d'olive",1,"c. à s.","plac"]],s:["Cuire le riz : puissance 9 jusqu'à ébullition, puis puissance 3 à couvert pendant 12 min.","Émincer finement le bœuf et les oignons.","Saisir le bœuf dans l'huile à puissance 9 pendant 2 min, puis le réserver.","Faire sauter les oignons et le gingembre râpé à puissance 7 pendant 5 min, remettre le bœuf avec la sauce soja et mélanger 1 min."]},
{id:"b72",n:"Steak, frites au four et salade",c:"Viande",t:35,i:[["Pavés de bœuf",2,"","viande"],["Pommes de terre",500,"g","leg"],["Salade verte",1,"","leg"],["Beurre",10,"g","cremerie"],["Huile d'olive",2,"c. à s.","plac"]],s:["Préchauffer le four à 220 °C. Couper les pommes de terre en frites et les mélanger avec l'huile et du sel.","Enfourner 30 min en les retournant à mi-cuisson.","Cuire les steaks dans le beurre à puissance 8, 3 min de chaque côté pour une cuisson à point.","Laisser reposer 2 min et servir avec les frites et la salade."]},
