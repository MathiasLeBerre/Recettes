/* =========================================================
   Synchronisation (Firebase) : compte, envoi et réception en temps réel
   ========================================================= */
let FB=null, user=null, syncOn=false, applying=false, pushTimer=null, unsubs=[], syncState='off', pendingWrites=0, renderLater=false, fbFailed=false;
let SY=loadSync();
function loadSync(){ try{ return JSON.parse(localStorage.getItem('au_menu_sync'))||{plans:{}}; }catch(e){ return {plans:{}}; } }
function saveSync(){ try{ localStorage.setItem('au_menu_sync',JSON.stringify(SY)); }catch(e){} }
const clean=o=>JSON.parse(JSON.stringify(o));
function coreOf(){ return clean({custom:S.custom,favs:S.favs,staples:S.staples||[],cooked:S.cooked||{},settings:{portions:S.settings.portions,days:S.settings.days}}); }
function planDays(p){ const d={}; for(let i=0;i<7;i++) d[i]=p.days[i]?clean(p.days[i]):null; return d; }
const planEmpty=p=>!Object.keys(p.days||{}).length&&!(p.checked||[]).length&&!(p.extras||[]).length;
const sortedJ=a=>JSON.stringify([...(a||[])].sort());
function remoteToPlan(d){ const p={days:{},checked:[],extras:clean(d.extras||[])}; Object.entries(d.days||{}).forEach(([i,v])=>{ if(v) p.days[i]=v; }); p.checked=Object.keys(d.checked||{}).filter(k=>d.checked[k]); return p; }
function isDirtyCore(){ return JSON.stringify(coreOf())!==SY.core; }
function isDirtyPlan(k){
  const p=S.plans[k], prev=(SY.plans||{})[k];
  if(!p) return !!prev; if(!prev) return !planEmpty(p);
  return JSON.stringify(planDays(p))!==prev.daysJ||JSON.stringify(p.extras||[])!==prev.exJ||sortedJ(p.checked)!==sortedJ(prev.checked);
}
function displayName(){
  if(S.settings.name) return S.settings.name;
  if(user&&user.email){ const w=user.email.split('@')[0].split(/[._-]/)[0]; return w.charAt(0).toUpperCase()+w.slice(1); }
  return '';
}
function setSync(st){ syncState=st; if(sheetType==='settings') openSettings(); }
const SYNC_LABEL={ok:'Tout est synchronisé',pending:'Envoi en cours…',offline:'Hors connexion : tes changements partiront au retour du réseau',error:'Problème de synchronisation',off:'Synchronisation désactivée'};
function track(pr){ pendingWrites++; setSync(navigator.onLine?'pending':'offline'); return pr.then(()=>{ if(--pendingWrites===0) setSync('ok'); }).catch(e=>{ pendingWrites--; handleSyncError(e); }); }
function handleSyncError(e){
  const c=(e&&e.code)||'';
  if(c.includes('permission-denied')){ setSync('error'); toast("Accès refusé par Firebase : vérifie les règles de sécurité (étape 6 du guide)."); }
  else if(c.includes('unavailable')||!navigator.onLine){ setSync('offline'); }
  else { setSync('error'); console.warn('Synchronisation',e); }
}
function schedulePush(){ if(!syncOn) return; clearTimeout(pushTimer); pushTimer=setTimeout(pushNow,400); }
function pushNow(){
  pushTimer=null; if(!syncOn) return;
  const core=JSON.stringify(coreOf());
  if(core!==SY.core){ SY.core=core; track(FB.setCore(JSON.parse(core))); }
  SY.plans=SY.plans||{};
  new Set([...Object.keys(S.plans),...Object.keys(SY.plans)]).forEach(k=>{
    const p=S.plans[k], prev=SY.plans[k];
    if(!p){ if(prev){ delete SY.plans[k]; track(FB.deletePlan(k)); } return; }
    if(!prev&&planEmpty(p)) return;
    const days=planDays(p), daysJ=JSON.stringify(days), exJ=JSON.stringify(p.extras||[]), pv=prev||{daysJ:null,exJ:null,checked:[]};
    const cur=new Set(p.checked), was=new Set(pv.checked), ch={};
    cur.forEach(x=>{ if(!was.has(x)) ch[x]=true; }); was.forEach(x=>{ if(!cur.has(x)) ch[x]=false; });
    const upd={}; if(daysJ!==pv.daysJ) upd.days=days; if(exJ!==pv.exJ) upd.extras=JSON.parse(exJ); if(Object.keys(ch).length) upd.checked=ch;
    if(Object.keys(upd).length){ SY.plans[k]={daysJ,exJ,checked:[...cur]}; track(FB.setPlan(k,upd)); }
  });
  saveSync();
}
function refreshAfterRemote(){
  const a=document.activeElement;
  if(a&&a.matches&&a.matches('input,textarea,select')){ renderLater=true; return; }
  render();
  if(sheetType==='recipe'&&ctx.id&&R(ctx.id)) openRecipe(ctx.id,ctx.d,true);
  else if(sheetType==='daily') openDaily(true);
  else if(sheetType==='daymenu'&&ctx.dm!=null&&plan().days[ctx.dm]) openDayMenu(ctx.dm);
}
document.addEventListener('focusout',()=>{ if(renderLater){ setTimeout(()=>{ const a=document.activeElement; if(!(a&&a.matches&&a.matches('input,textarea,select'))){ renderLater=false; refreshAfterRemote(); } },50); } });
function applyRemoteCore(d){
  if(!d||isDirtyCore()) return;
  const before=JSON.stringify(coreOf());
  applying=true;
  S.custom=d.custom||[]; S.favs=d.favs||[]; S.staples=d.staples||[]; S.cooked=d.cooked||{};
  if(d.settings){ if(d.settings.portions) S.settings.portions=d.settings.portions; if(Array.isArray(d.settings.days)&&d.settings.days.length) S.settings.days=d.settings.days; }
  SY.core=JSON.stringify(coreOf()); saveSync(); localSave(); applying=false;
  if(SY.core!==before) refreshAfterRemote();
  if(!pendingWrites) setSync(navigator.onLine?'ok':'offline');
}
function applyRemotePlans(docs,removed){
  let changed=false; SY.plans=SY.plans||{};
  docs.forEach(({id,data})=>{
    if(isDirtyPlan(id)) return;
    const p=remoteToPlan(data), j=JSON.stringify(p);
    if(!S.plans[id]||JSON.stringify(S.plans[id])!==j) changed=true;
    S.plans[id]=p; SY.plans[id]={daysJ:JSON.stringify(planDays(p)),exJ:JSON.stringify(p.extras),checked:[...p.checked]};
  });
  (removed||[]).forEach(id=>{ if(SY.plans[id]&&!isDirtyPlan(id)){ delete S.plans[id]; delete SY.plans[id]; changed=true; } });
  saveSync(); localSave();
  if(changed) refreshAfterRemote();
  if(!pendingWrites) setSync(navigator.onLine?'ok':'offline');
}
function mergeRemote(core,plans){
  if(core){
    const byId=new Map((core.custom||[]).map(r=>[r.id,r])); S.custom.forEach(r=>{ if(!byId.has(r.id)) byId.set(r.id,r); }); S.custom=[...byId.values()];
    S.favs=[...new Set([...(core.favs||[]),...S.favs])];
    const st=new Map((core.staples||[]).map(s=>[norm(s.t),s])); (S.staples||[]).forEach(s=>{ if(!st.has(norm(s.t))) st.set(norm(s.t),s); }); S.staples=[...st.values()];
    S.cooked={...(S.cooked||{}),...(core.cooked||{})};
    if(core.settings){ if(core.settings.portions) S.settings.portions=core.settings.portions; if(Array.isArray(core.settings.days)&&core.settings.days.length) S.settings.days=core.settings.days; }
  }
  (plans||[]).forEach(({id,data})=>{
    const rp=remoteToPlan(data), lp=S.plans[id];
    if(!lp||planEmpty(lp)){ S.plans[id]=rp; return; }
    for(let i=0;i<7;i++){ if(!rp.days[i]&&lp.days[i]) rp.days[i]=lp.days[i]; }
    rp.checked=[...new Set([...rp.checked,...(lp.checked||[])])];
    (lp.extras||[]).forEach(x=>{ if(!rp.extras.some(y=>norm(y.t)===norm(x.t))) rp.extras.push(x); });
    S.plans[id]=rp;
  });
}
async function startSync(){
  if(!FB||!user||syncOn) return;
  try{
    setSync('pending');
    if(SY.uid!==user.uid){
      const had=S.custom.length+S.favs.length+Object.values(S.plans).filter(p=>!planEmpty(p)).length;
      const [core,plans]=await Promise.all([FB.getCore(),FB.getPlans()]);
      mergeRemote(core,plans);
      SY={uid:user.uid,core:null,plans:{}}; saveSync(); localSave();
      if(had) toast(core?'Tes données de cet appareil ont rejoint le carnet commun.':'Ton carnet est maintenant en ligne.');
    }
    syncOn=true;
    unsubs.push(FB.listenCore(applyRemoteCore,handleSyncError),FB.listenPlans(applyRemotePlans,handleSyncError));
    pushNow(); render();
    if(!pendingWrites) setSync(navigator.onLine?'ok':'offline');
  }catch(e){ handleSyncError(e); if(!navigator.onLine) toast('Pas de connexion : la synchronisation démarrera au retour du réseau.'); }
}
function stopSync(){ unsubs.forEach(f=>{ try{ f(); }catch(e){} }); unsubs=[]; syncOn=false; clearTimeout(pushTimer); setSync('off'); }
window.addEventListener('online',()=>{ if(user&&!syncOn) startSync(); else if(syncOn){ schedulePush(); setSync(pendingWrites?'pending':'ok'); } });
window.addEventListener('offline',()=>{ if(syncOn) setSync('offline'); });

      <label>Mot de passe<input id="lgPass" type="password" autocomplete="current-password" required></label>
      <p class="login-msg" id="lgMsg" role="alert">${msg?esc(msg):''}</p>
      <button class="btn btn-primary btn-block" type="submit" id="lgBtn">Se connecter</button>
    </form>
    <button class="link login-link" data-a="login-reset">Mot de passe oublié ?</button>
    <button class="link login-skip" data-a="login-skip">Continuer sans compte, sur cet appareil seulement</button>
  </div>`;
  el.classList.add('show'); document.body.classList.add('locked');
  setTimeout(()=>{ const i=$('#lgEmail'); if(i) i.focus(); },50);
}
function hideLogin(){ $('#login').classList.remove('show'); if(!$('#sheet').classList.contains('show')&&!$('#cook').classList.contains('show')) document.body.classList.remove('locked'); }
const AUTH_MSG={'auth/invalid-credential':'Adresse e-mail ou mot de passe incorrect.','auth/wrong-password':'Adresse e-mail ou mot de passe incorrect.','auth/user-not-found':'Aucun compte avec cette adresse.','auth/invalid-email':"Cette adresse e-mail n'est pas valide.",'auth/too-many-requests':'Trop de tentatives : réessaie dans quelques minutes.','auth/network-request-failed':'Pas de connexion internet.','auth/missing-email':"Saisis d'abord ton adresse e-mail."};
const authMsg=e=>AUTH_MSG[e&&e.code]||"La connexion n'a pas abouti. Réessaie.";
window.onFirebaseReady=fb=>{
  FB=fb;
  FB.onAuth(u=>{
    user=u||null;
    if(user){ hideLogin(); try{ localStorage.removeItem('au_menu_local_only'); }catch(e){} startSync(); }
    else { stopSync(); let skip=false; try{ skip=!!localStorage.getItem('au_menu_local_only'); }catch(e){} if(!skip) showLogin(); }
    render(); if(sheetType==='settings') openSettings();
  });
};
window.onFirebaseFail=()=>{ fbFailed=true; };

/* Thème */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
function applyTheme(){
  const t=S.settings.theme, dark=t==='dark'||(t==='auto'&&mq&&mq.matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
  const m=document.querySelector('meta[name=theme-color]'); if(m) m.setAttribute('content',dark?'#0F1713':'#EDF0E7');
}
if(mq&&mq.addEventListener) mq.addEventListener('change',applyTheme);

$('.sheet-x').innerHTML=ico('close',18);
S=loadState();
applyTheme();
save();
render();
</script>
<script type="module">
/* Chargement de Firebase : si le réseau manque, l'app fonctionne quand même sur l'appareil */
const B='https://www.gstatic.com/firebasejs/10.14.1/';
try{
  const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  const app=initializeApp(window.FIREBASE_CONFIG), auth=A.getAuth(app);
  let db; try{ db=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }catch(e){ db=F.getFirestore(app); }
  const coreRef=F.doc(db,'foyers','maison','meta','core'), plansCol=F.collection(db,'foyers','maison','plans');
  window.onFirebaseReady({
    onAuth:cb=>A.onAuthStateChanged(auth,cb),
    signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
    reset:e=>A.sendPasswordResetEmail(auth,e),
    signOut:()=>A.signOut(auth),
    getCore:async()=>{ const s=await F.getDoc(coreRef); return s.exists()?s.data():null; },
    getPlans:async()=>(await F.getDocs(plansCol)).docs.map(d=>({id:d.id,data:d.data()})),
    setCore:d=>F.setDoc(coreRef,d),
    setPlan:(k,u)=>{ const mf=[]; if('days' in u) mf.push('days'); if('extras' in u) mf.push('extras'); Object.keys(u.checked||{}).forEach(x=>mf.push(new F.FieldPath('checked',x))); return F.setDoc(F.doc(plansCol,k),u,{mergeFields:mf}); },
    deletePlan:k=>F.deleteDoc(F.doc(plansCol,k)),
    listenCore:(cb,err)=>F.onSnapshot(coreRef,{includeMetadataChanges:true},s=>{ if(!s.metadata.hasPendingWrites) cb(s.exists()?s.data():null); },err),
    listenPlans:(cb,err)=>F.onSnapshot(plansCol,{includeMetadataChanges:true},q=>{ cb(q.docs.filter(d=>!d.metadata.hasPendingWrites).map(d=>({id:d.id,data:d.data()})),q.docChanges().filter(c=>c.type==='removed').map(c=>c.doc.id)); },err)
  });
}catch(e){ console.warn('Firebase indisponible',e); window.onFirebaseFail&&window.onFirebaseFail(e); }
</script>
